body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1d4a35 0,var(--bg) 60%);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
h1,h2,h3,.cond{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em;margin:0}
h1{font-size:34px;font-weight:700}
h2{font-size:24px}
h3{font-size:18px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.mono{font-family:'JetBrains Mono',monospace}
.mute{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
button{font:600 14px Inter,sans-serif;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer}
button:hover{border-color:var(--gold)}
button.primary{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
button.danger{background:#5a1f1a;border-color:#8a3128}
button:disabled{opacity:.4;cursor:default}
select{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--mute);font-size:13px;cursor:pointer}
table{width:100%;border-collapse:collapse}
th{font:600 11px Inter;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:6px 6px;border-bottom:1px solid #1d3a2e}
td.n,th.n{text-align:right;font-family:'JetBrains Mono',monospace}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:24px;border-radius:6px;font:700 13px 'Barlow Condensed';padding:0 5px}
.b-elite{background:linear-gradient(135deg,#1b1b1b,#3a3220);color:#ffd970;border:1px solid #c9a23a}
.b-gold{background:linear-gradient(135deg,#f6d77a,#c9a03a);color:#2a1e00}
.b-silver{background:linear-gradient(135deg,#e4e8ea,#9aa3a8);color:#1b1f22}
.b-bronze{background:linear-gradient(135deg,#d9a073,#94603a);color:#24130a}
.pot{opacity:.75}
.slot{display:grid;grid-template-columns:24px 1fr 40px 40px;gap:8px;align-items:center;margin-bottom:6px}
.slot select{width:100%}
.warn{color:var(--red);font-size:13px;margin-top:6px}
.ok{color:var(--green);font-size:13px;margin-top:6px}
/* match */
.board{background:linear-gradient(180deg,#0a1711,#10261c);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.scores{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tscore{font-family:'Barlow Condensed';font-size:22px}
.tscore b{font-size:30px;color:var(--cream)}
.status{font-family:'Barlow Condensed';font-size:20px;color:var(--gold);margin-top:6px}
.live{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:620px){.live{grid-template-columns:1fr}}
.liveBox{background:#0b1a13;border:1px solid var(--line);border-radius:10px;padding:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip{min-width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 12px 'JetBrains Mono';background:#22392e;color:var(--mute);padding:0 4px}
.chip.c4{background:#1f4f8a;color:#fff}.chip.c6{background:#6a3fa0;color:#fff}.chip.cW{background:var(--red);color:#fff}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:10px}/* 5.7.2 phone fixes */select{max-width:100%;min-width:0}.card label{max-width:100%;min-width:0}.grid2>*,.grid3>*{min-width:0}.tabs{flex-wrap:wrap}@media(max-width:620px){.card:not(.scroll) table{display:block;overflow-x:auto;max-width:100%}}
.tabs button{padding:7px 12px}
.tabs button.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.feed{max-height:560px;overflow:auto}
.ev{padding:8px 10px;border-left:3px solid transparent;border-bottom:1px solid #1d3a2e}
.ev .meta{font-size:11px;color:var(--mute)}
.ev.wkt{border-left-color:var(--red);background:#2a1614}
.ev.mile{border-left-color:var(--gold);background:#2a2614}
.ev.session{border-left-color:var(--blue);background:#132433}
.ev.result{border-left-color:var(--green);background:#14301f;font-weight:600}
.ev.innings,.ev.info{border-left-color:#4a6b5c}
.ev.drop{border-left-color:#d98a3a}
.ev.four,.ev.six{color:#c9d8cf}
.inn-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 4px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:20px;max-width:420px;width:100%}
.modal p{color:var(--mute)}
.modal .btns{display:flex;gap:10px;margin-top:14px}
.banner{background:linear-gradient(90deg,#1f5a39,#14301f);border:1px solid var(--green);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wear{display:inline-flex;gap:3px;vertical-align:middle}
.wear i{width:10px;height:10px;border-radius:2px;background:#22392e}
.wear i.on{background:#c98f4a}
.sm{font-size:12px}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:rgba(9,22,16,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.nav .logo{font-size:20px;font-weight:700;color:var(--gold);margin-right:10px}
.navb{padding:7px 12px;font-size:13px}.navb.on{border-color:var(--gold);color:var(--gold)}
#saveBtn{margin-left:auto}
.title-screen{max-width:640px;margin:12vh auto;padding:24px;text-align:center}
.big{font-size:64px;line-height:1;margin:10px 0}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.title-screen .btns{justify-content:center}
.hero h2{font-size:30px;margin:4px 0}
.venues{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag.done{opacity:.5;text-decoration:line-through}.tag.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.kpis{display:flex;gap:10px}.kpis div{flex:1;background:#0b1a13;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.kpis b{display:block;font:700 28px 'Barlow Condensed'}.kpis span{font-size:12px;color:var(--mute)}
.calrow{display:grid;grid-template-columns:200px 1fr auto;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid #1d3a2e}
.calrow.past{opacity:.5}.calrow.now{background:#1a3326;border-radius:8px}
@media(max-width:700px){.calrow{grid-template-columns:1fr}}
.right{text-align:right}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
input[type=text],input:not([type]),textarea{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{width:100%;height:120px;font:12px 'JetBrains Mono',monospace;margin-top:8px}
.modal.wide{max-width:560px}
.modal{max-height:92vh;overflow-y:auto}
.modal.xl{max-width:900px;max-height:90vh;overflow:auto}
.scroll{overflow-x:auto}
tr.pick{cursor:pointer}tr.pick:hover{background:#1a3326}tr.pick.sel{background:#1d3b2b}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.warnc{color:var(--red)}.win{color:var(--green);font-weight:600}.loss{color:var(--red);font-weight:600}
.tact{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pb{display:flex;gap:8px;justify-content:flex-end;align-items:center}.bars{display:inline-flex;gap:3px}.bars i{width:14px;height:8px;border-radius:2px;background:#22392e}.bars i.on{background:var(--gold)}
.slot{grid-template-columns:24px 1fr 40px auto}
a.pl{color:var(--ink);cursor:pointer;border-bottom:1px dotted #5a7a6a;text-decoration:none}a.pl:hover{color:var(--gold)}
.fm{font-size:11px;padding:1px 6px;border-radius:99px;font-weight:600}.fm.hot{background:#7a2a12;color:#ffb38a}.fm.good{background:#1f4a2f;color:#8fe0a8}.fm.poor{background:#3a3220;color:#d9b36a}.fm.cold{background:#20304a;color:#8ab4ff}
.inj{font-size:11px;padding:1px 6px;border-radius:4px;background:#5a1f1a;color:#ffb0a8;font-weight:600}
.news{padding:7px 0;border-bottom:1px solid #1d3a2e}.news.big{border-left:3px solid var(--gold);padding-left:8px;font-size:inherit;line-height:inherit;margin:0}.news.good{border-left:3px solid var(--green);padding-left:8px}.news.bad{border-left:3px solid var(--red);padding-left:8px}
.attr{display:grid;grid-template-columns:110px 1fr 30px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.abar{height:8px;background:#22392e;border-radius:4px;overflow:hidden}.abar i{display:block;height:100%}.abar i.e{background:#f2c84b}.abar i.g{background:#c9a03a}.abar i.s{background:#9aa3a8}.abar i.b{background:#94603a}
.modal.xl{max-width:880px;max-height:90vh;overflow:auto}
.grid3c{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}@media(max-width:760px){.grid3c{grid-template-columns:1fr}}
.fc{display:flex;gap:6px;flex-wrap:wrap}.fcd{background:#0b1a13;border:1px solid var(--line);border-radius:8px;padding:4px 8px;text-align:center}
.wx{display:inline-block;width:20px;text-align:center;font-size:15px}.wx.now{outline:2px solid var(--gold);border-radius:4px}
tr.top2 td{background:#16301f}tr.us td{color:var(--gold)}tr.dis{opacity:.45}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
th.sortable{cursor:pointer}th.sortable:hover,th.on{color:var(--gold)}
.navdate{margin-left:auto}#saveBtn{margin-left:8px}
.mor{font-size:11px;padding:1px 6px;border-radius:99px;font-weight:600}.mor{border:1px solid #3a5a4a}.mor.mDelighted{background:#16324a;color:#9fd0ff}.mor.mHappy{background:#16283a;color:#a8c8e8}.mor.mContent{background:#20282e;color:#b8c0c8}.mor.mUnsettled{background:#4a3a1a;color:#e8c070}.mor.mUnhappy{background:#5a1f1a;color:#ffb0a8}
.cap{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--gold);color:#1a1a1a;font-weight:700}.cap.vc{background:#9aa3a8}
.conf{display:flex;gap:10px;align-items:center}.abar.big{flex:1;height:14px;border-radius:7px}.conf b{font:700 22px 'Barlow Condensed'}
.xirow{display:grid;grid-template-columns:22px 1fr 44px auto auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid transparent;border-bottom:1px solid #1d3a2e;border-radius:8px;cursor:pointer}
.xirow:hover{background:#1a3326}.xirow.on{border-color:var(--gold);background:#2a2614}.xirow.bench{cursor:pointer}.xirow.dis{opacity:.45;cursor:default}
.xmain{min-width:0}.en{font:12px 'JetBrains Mono';color:var(--green);text-align:right}.en.low{color:var(--red)}
.xbtns{display:flex;gap:3px}.mini{padding:2px 7px;font-size:11px;border-radius:6px}
tr.crease td{background:#2a2614;color:var(--cream);font-weight:600}
/* ---- white-ball ---- */
.fb{display:inline-block;font:600 11px/1 'Barlow Condensed',sans-serif;letter-spacing:.06em;padding:3px 6px;border-radius:4px;vertical-align:middle;text-transform:uppercase}
.f-test{background:#efe6d2;color:#5b4a1f}.f-odi{background:#d9e8f7;color:#1d4f86}.f-t20{background:#f6dbe6;color:#8a1f4c}
.legs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 2px}
.leg{font-size:12px;padding:3px 8px;border:1px solid var(--line,#ddd);border-radius:999px;opacity:.75}
.leg.on{opacity:1;border-color:var(--gold,#c9a227);font-weight:600}.leg.done{opacity:.55;text-decoration:line-through}
.fboxes{display:flex;gap:10px;justify-content:flex-end}.fbox{text-align:center}.fbox .badge{font-size:15px}
.calfx{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line,#e5e5e5)}.calfx:last-child{border-bottom:0}
.grid2c{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clubs{display:flex;flex-wrap:wrap;gap:6px}.clubs .tag{cursor:pointer}
details summary{cursor:pointer}
.savewarn{background:#5a1f1f;color:#fff;padding:8px 16px;font-size:13px;text-align:center}
.updbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--gold,#c9a227);color:#111;padding:10px 16px;border-radius:10px;font-weight:600;z-index:99;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.updbar button{background:#111;color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer}
</style>

//   bat = batting level, agg = aggression, tilt = + better vs pace / - better vs spin, bowl = 'TYPE skill'
//   x: h (L/R), keep, field (catching), ground, peak (career-best OVR, used for regens), form (-10..10),
//      off, on (scoring areas), swing, seam (pace), turn, flight (spin), acc, stam, prone (injury), st (state)
// Bowling types: RF, RFM, RM, LF, LFM (pace) and OB, LB, SLA (spin)

  const v = k => hashN(name + k);
  const conc = bat + (agg < 55 ? 2 : agg > 80 ? -2 : 0) + v('c') * 2;
  const tl = tilt + v('t') * 2;

    name, age, role, nat: x.nat, state: x.st || null, hand: x.h || 'R',

function wbInit(p) {
  const o = Object.assign({}, WB_OVR[p.name] || {}, p.wb0 || {});
  const b = p.bat, bl = (b.tech + b.conc + b.vPace + b.vSpin) / 4;
  if (b.power == null) b.power = Math.round(o.power || Math.min(97, b.agg * 0.6 + bl * 0.35 + hashN(p.name + 'pw') * 5));
  if (b.finish == null) b.finish = Math.round(o.finish || Math.min(95, b.agg * 0.35 + bl * 0.6 + hashN(p.name + 'fn') * 5));
  if (p.bowl) {
    const w = p.bowl;
    if (w.death == null) w.death = Math.round(o.death || w.skill * 0.55 + w.acc * 0.35 + hashN(p.name + 'dt') * 5 - (['OB', 'LB', 'SLA'].includes(w.type) ? 4 : 0));
    if (w.vars == null) w.vars = Math.round(o.vars || w.skill * 0.7 + hashN(p.name + 'vr') * 6);
  }
  delete p.wb0;
  return p;
}

  const leaders = (k, f) => Object.entries(sh.stats).filter(([n, s]) => f(s) > 0).sort((a, b) => f(b[1]) - f(a[1])).slice(0, 10);

// ================= STATS =================
function vStats() {
  const comp = ui.comp || 'test', scope = ui.scope || 'ALL', cat = ui.cat || 'bat';
  const rows = [];
  const ys = C.ySt || {};
  const seasonSrc = { season: C.shield.stats, odcS: C.odc.stats, bblS: C.bbl.stats, testY: ys.test || {}, odiY: ys.odi || {}, t20iY: ys.t20i || {} }[comp];
  const src = seasonSrc ? Object.entries(seasonSrc) : Object.entries(C.stats).map(([n, o]) => [n, o[comp]]).filter(x => x[1]);
  const lo = ['odi', 't20i', 'odc', 'bbl', 'odcS', 'bblS', 'odiY', 't20iY'].includes(comp), intl = ['test', 'odi', 't20i', 'testY', 'odiY', 't20iY'].includes(comp);
  src.forEach(([n, s]) => {
    const p = CR.P_(C, n); const nat = p ? p.nat : '?';
    if (scope !== 'ALL' && nat !== scope && !(scope === 'AUS' && p && p.state)) return;
    rows.push({ n, s, nat, st: p ? p.state : '', retired: !p });
  });
  const minI = +(ui.min || (comp === 'test' ? 3 : 3));
  const cols = {
    bat: [['Player', r => `${pl(r.n)} <span class="mute sm">${intl ? r.nat : r.st || r.nat}</span>`], ['M', r => r.s.m, 'm'], ['Inn', r => r.s.inn, 'inn'], ['NO', r => r.s.no, 'no'], ['Runs', r => r.s.runs, 'runs'], ['HS', r => r.s.hs + (r.s.hsNo ? '*' : ''), 'hs'],
      ['Avg', r => avgS(r.s), 'avg'], ['Balls', r => r.s.balls, 'balls'], ['SR', r => r.s.balls ? (r.s.runs / r.s.balls * 100).toFixed(1) : '-', 'sr'], ['100', r => r.s.h100, 'h100'], ['50', r => r.s.h50, 'h50'], ['0', r => r.s.ducks, 'ducks'], ['4s', r => r.s.fours, 'fours'], ['6s', r => r.s.sixes, 'sixes']],
    bowl: [['Player', r => `${pl(r.n)} <span class="mute sm">${intl ? r.nat : r.st || r.nat}</span>`], ['M', r => r.s.m, 'm'], ['Overs', r => E.oversStr(r.s.bBalls), 'bBalls'], ['Mdns', r => r.s.mdn, 'mdn'], ['Runs', r => r.s.bRuns, 'bRuns'], ['Wkts', r => r.s.wk, 'wk'],
      ['Avg', r => r.s.wk ? (r.s.bRuns / r.s.wk).toFixed(2) : '-', 'bavg'], ['Econ', r => r.s.bBalls ? (r.s.bRuns / r.s.bBalls * 6).toFixed(2) : '-', 'econ'], ['SR', r => r.s.wk ? (r.s.bBalls / r.s.wk).toFixed(1) : '-', 'bsr'], ['Best', r => r.s.bw ? `${r.s.bw}/${r.s.br}` : '-', 'bw'], ...(lo ? [['4w', r => r.s.fourW || 0, 'fourW'], ['5w', r => r.s.fiveW, 'fiveW']] : [['5w', r => r.s.fiveW, 'fiveW'], ['10w', r => r.s.tenW, 'tenW']])],
    field: [['Player', r => `${pl(r.n)} <span class="mute sm">${intl ? r.nat : r.st || r.nat}</span>`], ['M', r => r.s.m, 'm'], ['Catches', r => r.s.ct, 'ct'], ['Stumpings', r => r.s.st, 'st'], ['Run outs', r => r.s.ro, 'ro'], ['Dismissals', r => r.s.ct + r.s.st + r.s.ro, 'dis'], ['Per match', r => r.s.m ? ((r.s.ct + r.s.st + r.s.ro) / r.s.m).toFixed(2) : '-', 'pm']],
  }[cat];
  const num = { avg: s => s.inn - s.no > 0 ? s.runs / (s.inn - s.no) : 0, sr: s => s.balls ? s.runs / s.balls : 0, bavg: s => s.wk ? -s.bRuns / s.wk : -999, econ: s => s.bBalls ? -s.bRuns / s.bBalls : -99, bsr: s => s.wk ? -s.bBalls / s.wk : -999, bw: s => s.bw * 1000 - s.br, dis: s => s.ct + s.st + s.ro, pm: s => s.m ? (s.ct + s.st + s.ro) / s.m : 0 };
  const sk = ui.sk || (cat === 'bat' ? 'runs' : cat === 'bowl' ? 'wk' : 'dis');
  const qual = cat === 'bat' ? (r => ['avg', 'sr'].includes(sk) ? r.s.inn >= minI : r.s.inn > 0) : cat === 'bowl' ? (r => ['bavg', 'econ', 'bsr'].includes(sk) ? r.s.wk >= minI * 3 : r.s.bBalls > 0) : (r => r.s.m > 0);
  const list = rows.filter(qual).sort((a, b) => (num[sk] ? num[sk](b.s) - num[sk](a.s) : (b.s[sk] || 0) - (a.s[sk] || 0))).slice(0, 60);
  const opt = (id, cur, items) => `<select id="${id}">${items.map(([v, l]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  return `<div class="wrap"><div class="top"><h2>Stats</h2><div class="filters">
    ${opt('sComp', comp, [['testY', `Tests ${CR.seasonLabel(CR.curWindow(C).season)}`], ['odiY', `ODIs ${CR.seasonLabel(CR.curWindow(C).season)}`], ['t20iY', `T20Is ${CR.seasonLabel(CR.curWindow(C).season)}`], ['test', 'Test career'], ['odi', 'ODI career'], ['t20i', 'T20I career'], ['shield', 'Shield career'], ['season', `Shield ${CR.seasonLabel(C.shield.y)}`], ['odc', 'One-Day Cup career'], ['odcS', `One-Day Cup ${CR.seasonLabel(C.odc.y)}`], ['bbl', 'BBL career'], ['bblS', `BBL|${C.bbl.y - 2010}`]])}
    ${opt('sScope', scope, [['ALL', 'All players'], ...CR.NATIONS.map(n => [n, tName(n)])])}
    ${opt('sCat', cat, [['bat', 'Batting'], ['bowl', 'Bowling'], ['field', 'Fielding']])}
    ${opt('sMin', String(minI), [['1', 'Min 1'], ['3', 'Min 3'], ['5', 'Min 5'], ['10', 'Min 10']])}</div></div>
  <p class="mute sm">Click a column to sort. Averages and strike rates need the minimum innings (or three times that many wickets for bowlers). Season stats reset every year after the awards night; career stats count from the start of this career and are never deleted.</p>
  <div class="card scroll">${list.length ? `<table><tr><th>#</th>${cols.map(c => `<th class="${c[2] ? 'n sortable' : ''} ${c[2] === sk ? 'on' : ''}" ${c[2] ? `data-ssort="${c[2]}"` : ''}>${c[0]}</th>`).join('')}</tr>
    ${list.map((r, i) => `<tr><td class="mute">${i + 1}</td>${cols.map(c => `<td class="${c[2] ? 'n' : ''}">${c[1](r)}</td>`).join('')}</tr>`).join('')}</table>` : '<div class="mute">No stats yet for this view.</div>'}</div></div>`;
}

}
function confBar(v) { const cls = v >= 60 ? 'g' : v >= 35 ? 's' : 'b'; return `<div class="conf"><span class="abar big"><i class="${cls}" style="width:${v}%"></i></span><b>${Math.round(v)}%</b></div><div class="mute sm">${v >= 75 ? 'The board is delighted with you.' : v >= 55 ? 'The board is happy with your work.' : v >= 35 ? 'The board expects improvement.' : v >= 15 ? 'Your job is under pressure.' : 'Your job is on the line.'}</div>`; }

// ================= BOARD =================
function vBoard() {

  const best = p => Math.max(E.overall(p), E.wbOverall(p, 'odi'), E.wbOverall(p, 't20'));
  const list = aus.filter(p => sel.has(p.name) || best(p) >= (ui.cmin || 72)).sort((a, b) => best(b) - best(a));
  return `<div class="wrap"><h2 style="margin-bottom:10px">Board room</h2>${typeof careerHTML === 'function' ? careerHTML() : ''}${typeof dressingHTML === 'function' ? dressingHTML() : ''}<div class="grid2">
    <div class="card"><h3>Board confidence</h3>${confBar(C.board.conf)}

      <div class="mute sm" style="margin-top:8px">The board judges you on results against expectations, the WTC, giving young players a chance, and whether you pick in-form players. Ignoring big Shield performers or backing out-of-form players draws media criticism.</div>
      <h3 style="margin-top:12px">Recent verdicts</h3>${C.board.log.slice(0, 10).map(l => `<div class="row sm"><span>${esc(l.why)}</span><span class="${l.v >= 0 ? 'win' : 'loss'}">${l.v >= 0 ? '+' : ''}${Math.round(l.v * 10) / 10}</span></div>`).join('') || '<div class="mute sm">Nothing yet.</div>'}</div>
    <div class="card"><h3>Captaincy</h3>
      <div class="form"><label>Captain<select id="capSel"><option value="">None</option>${capOpts(C.captain)}</select></label><label>Vice-captain<select id="viceSel"><option value="">None</option>${capOpts(C.vice)}</select></label></div>
      <p class="mute sm">A strong leader lifts the whole side a little and makes sharper bowling changes. Weak leaders can let the job weigh on their own batting. Changing captain upsets the old one, and doing it mid-series worries the board.</p>
      <button class="primary" id="capSave">Confirm Test leadership</button>
      <h3 style="margin-top:14px">White-ball captains</h3>
      ${['odi', 't20'].map(f => { const cc = C.captains[f] || []; const opts = cur => aus.filter(p => E.wbOverall(p, f) >= 72 && CR.intlOK(p, f)).sort((a, b) => leadFmt(b, f) - leadFmt(a, f)).map(p => `<option value="${esc(p.name)}" ${p.name === cur ? 'selected' : ''}>${esc(p.name)} (leadership ${Math.round(leadFmt(p, f))}, ${FN[f]} ${E.wbOverall(p, f)})</option>`).join('');
        return `<div class="form"><label>${FN[f]} captain<select id="wcap_${f}"><option value="">None</option>${opts(cc[0])}</select></label><label>Vice<select id="wvice_${f}"><option value="">None</option>${opts(cc[1])}</select></label></div>`; }).join('')}
      <button id="wcapSave">Confirm white-ball leadership</button></div></div>
  <div class="card" style="margin-top:14px"><div class="top"><h3 style="margin:0">National contracts ${CR.seasonLabel(CR.curWindow(C).season)} · ${sel.size} players</h3>
    <div class="filters"><select id="cMin">${[60, 68, 72, 76].map(n => `<option value="${n}" ${n === (ui.cmin || 72) ? 'selected' : ''}>OVR ${n}+</option>`).join('')}</select>
    ${editable ? `<button class="primary" id="cConfirm" ${sel.size >= 20 && sel.size <= 24 ? '' : 'disabled'}>Confirm contracts</button>` : ''}</div></div>
    <p class="mute sm">${editable ? 'Renewals are open. Offer 20 to 24 contracts. New contracts lift morale; losing one hurts, and unhappy veterans may walk away from Test cricket.' : 'Contracts renew once a season, at the start of the winter. Anyone who plays a Test without one gets an automatic upgrade.'}</p>
    <div class="scroll"><table><tr><th></th><th>Player</th><th class="n">Age</th><th>State</th><th>Role</th><th>Test</th><th>ODI</th><th>T20</th><th>POT</th><th>Form</th><th>Morale</th><th class="n">Leadership</th></tr>
    ${list.map(p => `<tr class="${editable ? 'pick' : ''} ${sel.has(p.name) ? 'sel' : ''}" ${editable ? `data-ctog="${esc(p.name)}"` : ''}><td><input type="checkbox" ${sel.has(p.name) ? 'checked' : ''} ${editable ? '' : 'disabled'}></td><td>${pl(p.name)}${capTag(p.name)} ${injTag(p)}</td><td class="n">${p.age}</td><td>${p.state || ''}</td><td>${p.role}</td><td>${badge(E.overall(p))}</td><td>${badge(E.wbOverall(p, 'odi'))}</td><td>${badge(E.wbOverall(p, 't20'))}</td><td>${badge(Math.max(E.potential(p), E.wbPotential(p, 'odi'), E.wbPotential(p, 't20')), 'pot')}</td><td>${formTag(p)}</td><td>${morTag(p)}</td><td class="n">${Math.round(p.lead)}</td></tr>`).join('')}</table></div></div></div>`;

// ================= GOAT =================
function vGoat() {
  const k = ui.gk || 'all';

  const L = CR.goatLists(C), list = L[k].slice(0, 50);

    <div class="tabs" style="margin:0">${tabs.map(([v, l]) => `<button data-gk="${v}" class="${k === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>

  on('[data-xslot]', 'onclick', e => { if (e.target.closest('button') || e.target.closest('a')) return; const i = +e.currentTarget.dataset.xslot; if (ui.selSlot != null && ui.selSlot !== i && ui.xi[ui.selSlot] != null) { [ui.xi[ui.selSlot], ui.xi[i]] = [ui.xi[i], ui.xi[ui.selSlot]]; ui.selSlot = null; } else ui.selSlot = ui.selSlot === i ? null : i; render(); });
  on('[data-up]', 'onclick', e => { const i = +e.currentTarget.dataset.up; if (i > 0) { [ui.xi[i - 1], ui.xi[i]] = [ui.xi[i], ui.xi[i - 1]]; ui.selSlot = null; render(); } });
  on('[data-down]', 'onclick', e => { const i = +e.currentTarget.dataset.down; if (i < ui.xi.length - 1) { [ui.xi[i + 1], ui.xi[i]] = [ui.xi[i], ui.xi[i + 1]]; ui.selSlot = null; render(); } });

    if (ui.selSlot != null) { ui.xi[ui.selSlot] = n; ui.selSlot = null; } else if (ui.xi.length < 11) ui.xi.push(n); else { ui.flash = 'XI is full: select a player in the XI first, then click the bench player to swap.'; }
    render(); });
  on('[data-pl]', 'onclick', e => { e.stopPropagation(); const n = e.currentTarget.dataset.pl; openModal(() => profileModal(n)); });
  on('[data-state]', 'onclick', e => { const s = e.currentTarget.dataset.state; openModal(() => stateModal(s)); });

  on('[data-dom]', 'onclick', e => { ui.dom = e.currentTarget.dataset.dom; render(); });
  on('#saveBtn', 'onclick', () => {
    const code = saveCode();
    openModal(() => `<div class="modal-bg"><div class="modal wide"><h2>Save code</h2><p class="mute">Your career saves automatically in this browser. To back it up or move it to another device, copy this code and load it from the title screen.</p><textarea id="codeBox" readonly>${code}</textarea><div class="btns"><button class="primary" id="copyCode">Copy</button><button id="mClose">Close</button></div></div></div>`);
  });
  on('#copyCode', 'onclick', () => { const t = $('#codeBox'); navigator.clipboard && navigator.clipboard.writeText(t.value).then(() => { $('#copyCode').textContent = 'Copied'; }).catch(() => t.select()); });
  on('#cont', 'onclick', async () => { if (!C) C = await load(); if (!C) return; save(); go(C.match ? 'match' : 'hub'); whatsNew(); });
  on('#restoreBk', 'onclick', async () => { try { const b = await restoreBackup(); if (b && confirmRestore()) { C = b; save(); go('hub'); } } catch (e) { } });
  on('#newc', 'onclick', () => { $('#loading').textContent = 'Setting up the world and simulating the first Shield rounds…'; setTimeout(() => { C = CR.newCareer(); C.seenVer = GAME_VERSION; save(); go('hub'); if (typeof clubPickModal === 'function') openModal(clubPickModal); }, 30); });
  on('#imp', 'onclick', () => openModal(() => '<div class="modal-bg"><div class="modal wide"><h2>Load save code</h2><textarea id="codeIn" placeholder="Paste your save code"></textarea><div id="impErr" class="warn"></div><div class="btns"><button class="primary" id="doImp">Load</button><button id="mClose">Cancel</button></div></div></div>'));

  on('#nextWin', 'onclick', advance);
  on('[data-plan]', 'onclick', e => { const k = e.currentTarget.dataset.plan; ui.plan = null; ui.planKey = k.includes('|') ? k : k + '|'; openModal(() => planModal(ui.planKey)); });
  on('[data-cancel]', 'onclick', e => { const [wk, fm] = e.currentTarget.dataset.cancel.split('|'); const w = C.windows.find(x => x.key === wk);
    if (fm === 'test') w.fixture = null; else w.wb = (w.wb || []).filter(f => f.fmt !== fm); CR.scheduleWindow(w); save(); render(); });
  const st = ui.plan;
  if (st) {
    on('#pFmt', 'onchange', e => { st.fmt = e.target.value; st.venues = null; render(); });
    on('#pOpp', 'onchange', e => { st.opp = e.target.value; st.venues = null; render(); });

      else { w.wb = (w.wb || []).filter(f => f.fmt !== st.fmt); w.wb.push(CR.mkWB(st.fmt, st.opp, st.home, st.tests, st.venues.slice(), st.title.trim(), { when: w.fixture ? st.when : 'post' })); }

  on('#natSel', 'onchange', e => go('players', { code: e.target.value, fmt: ui.fmt }));
  on('[data-pfmt]', 'onclick', e => { ui.fmt = e.currentTarget.dataset.pfmt; ui.sk = null; render(); });
  on('#stSel', 'onchange', e => { ui.st = e.target.value; render(); });
  on('#roleSel', 'onchange', e => { ui.role = e.target.value; render(); });
  on('#pq', 'onchange', e => { ui.q = e.target.value; render(); });
  on('[data-psort]', 'onclick', e => { ui.sk = e.currentTarget.dataset.psort; render(); });
  on('#sComp', 'onchange', e => { ui.comp = e.target.value; render(); });
  on('#sScope', 'onchange', e => { ui.scope = e.target.value; render(); });
  on('#sCat', 'onchange', e => { ui.cat = e.target.value; ui.sk = null; render(); });
  on('#sMin', 'onchange', e => { ui.min = e.target.value; render(); });
  on('[data-ssort]', 'onclick', e => { ui.sk = e.currentTarget.dataset.ssort; render(); });
  on('[data-rt]', 'onclick', e => { ui.rt = e.currentTarget.dataset.rt; render(); });
  on('[data-rf]', 'onclick', e => { ui.rf = e.currentTarget.dataset.rf; render(); });
  on('[data-tog]', 'onclick', e => { const n = e.currentTarget.dataset.tog; ui.sel.has(n) ? ui.sel.delete(n) : ui.sel.add(n); render(); });
  on('#sqSt', 'onchange', e => { ui.st = e.target.value; render(); });
  on('#sqRole', 'onchange', e => { ui.role = e.target.value; render(); });
  on('#sqMin', 'onchange', e => { ui.minO = e.target.value; render(); });
  on('#autoSquad', 'onclick', () => { const f = curFixture(), fm = fmtF(f); ui.sel = new Set((fm === 'test' ? CR.autoSquad(C.players.AUS, 15) : CR.autoSquadLO(C.players.AUS, fm, 15)).map(p => p.name)); render(); });
  on('#confirmSquad', 'onclick', () => {
    const f = curFixture();
    f.squad = C.players.AUS.filter(p => ui.sel.has(p.name)).map(p => p.name);
    if (f.status !== 'active') {
      const fm = fmtF(f);
      if (!f.wc) f.oppSquad = (fm === 'test' ? CR.autoSquad(C.players[f.opp], 15) : CR.autoSquadLO(C.players[f.opp], fm, 15)).map(p => p.name).sort((a, b) => C.players[f.opp].findIndex(p => p.name === a) - C.players[f.opp].findIndex(p => p.name === b));
      f.status = 'active'; if (fm === 'test') C.energy = {};
      CR.news(C, `${FN[fm]} squad named for ${f.title || fixtureDesc(f)}: ${f.squad.join(', ')}.`);
      if (fm === 'test') CR.onSquadNamed(C, f); else { f.exp = CR.expectationWB(C, f); C.board.exp = f.exp.text; }
    }
    save(); go('series');
  });
  on('#editSquad', 'onclick', () => go('squad', { sel: new Set(curFixture().squad) }));
  on('#toPre', 'onclick', () => { const f = curFixture(), fm = fmtF(f);
    if (!f.wc) { f.oppSquad = f.oppSquad.filter(n => CR.P_(C, n)); const opp = f.oppSquad.map(n => CR.P_(C, n)).filter(p => CR.available(p)); if (opp.length < 13) { (fm === 'test' ? CR.autoSquad(C.players[f.opp], 15) : CR.autoSquadLO(C.players[f.opp], fm, 15)).forEach(p => { if (!f.oppSquad.includes(p.name)) f.oppSquad.push(p.name); }); } }
    go('prematch'); });

  on('[data-slot]', 'onchange', e => { const i = +e.target.dataset.slot, n = e.target.value.replace(' (injured)', ''), j = ui.xi.indexOf(n); if (j >= 0) ui.xi[j] = ui.xi[i]; ui.xi[i] = n; render(); });
  on('#autoXI', 'onclick', () => { const f = curFixture(), fm = fmtF(f), sq = f.squad.map(n => CR.P_(C, n)).filter(Boolean), v = VENUES[f.venues[f.testIdx]]; ui.xi = fm === 'test' ? CR.autoXI(sq, v, restedEnergy()) : CR.autoXILO(sq, fm, v); ui.selSlot = null; render(); });
  on('#startTest', 'onclick', startTest);
  const m = C && C.match;
  if (m && screen === 'match') {

    on('[data-sim]', 'onclick', e => { const b = e.currentTarget; E.simUntil(m, b.dataset.sim, +b.dataset.n || 0); step(); });

    on('[data-fo]', 'onclick', e => { E.followOnDecision(m, e.currentTarget.dataset.fo === '1'); step(); });
    on('#pw', 'onchange', e => { m.stopOnWicket = e.target.checked; save(); });
    on('#peo', 'onchange', e => { m.pauseEachOver = e.target.checked; save(); });
    on('#ad', 'onchange', e => { m.autoDeclare = e.target.checked; save(); });
    on('#nw', 'onchange', e => { m.teams[m.user].nightwatch = e.target.value; save(); });
    on('#appr', 'onchange', e => { m.teams[m.user].approach = e.target.value; step(); });
    on('#fld', 'onchange', e => { m.teams[m.user].field = e.target.value; step(); });
    on('#bmode', 'onchange', e => { const t = m.teams[m.user]; t.bowlMode = e.target.value; if (t.bowlMode === 'manual') t.plan = m.lo ? [null, null] : m.endBowler.slice(); step(); });
    on('[data-end]', 'onchange', e => { if (e.target.value === '') return; E.setPlan(m, +e.target.dataset.end, +e.target.value); step(); });
    on('#nextBowler', 'onchange', e => { if (e.target.value === '') return; E.setPlan(m, 0, +e.target.value); step(); });
    on('#decl', 'onclick', () => { m.declareRequested = true; E.simUntil(m, 'ball'); step(); });
    on('#sb', 'onchange', e => { showBoundaries = e.target.checked; render(); });
    on('#afterMatch', 'onclick', afterMatch);
  }
}

// ================= UPDATES (website / installed app only) =================
// When a new version is published, the browser downloads it in the background and we offer a one-click update.
// Inside the claude.ai artifact or a local file this does nothing.
function showUpdateBar(worker) {
  if (document.querySelector('.updbar')) return;
  const bar = document.createElement('div'); bar.className = 'updbar';
  bar.innerHTML = '<span>A new version of Cricket Manager is ready.</span><button>Update</button>';
  bar.querySelector('button').onclick = () => { (C ? saveFlush() : Promise.resolve()).then(() => worker.postMessage('update')); };
  document.body.appendChild(bar);
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude|anthropic/.test(location.hostname)) {
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar(w); });
    });
    setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
  }).catch(() => {});
}

<script>// ===== VERSION 5.2 UI ADDITIONS =====

const PITCH_REQ = { default: 'Leave it to the curator', green: 'Green top (pace and seam)', flat: 'Flat road (good for batting)', turner: 'Dry turner (spin, wears faster)' };
function pitchApply(v, req) {
  if (!req || req === 'default') return { v, note: '' };
  const ok = Math.random() < 0.8, x = Object.assign({}, v);
  if (ok) {
    if (req === 'green') { x.pace = Math.min(5, v.pace + 1.5); x.flat = v.flat - 0.5; x.spin = v.spin - 0.5; }
    if (req === 'flat') { x.flat = Math.min(3, v.flat + 1); x.pace = v.pace - 0.5; x.spin = v.spin - 0.3; }
    if (req === 'turner') { x.spin = Math.min(4, v.spin + 1.5); x.wear = v.wear + 0.3; x.pace = v.pace - 0.7; }
  }
  return { v: x, note: ok ? `The curator has prepared the ${req === 'green' ? 'green top' : req === 'flat' ? 'flat road' : 'dry turner'} you asked for.` : `The curator ignored your request and prepared a normal ${v.name.split(',')[0]} pitch.` };
}

function cmApply() {

const TSORT = {};
function cellVal(td) {
  const t = (td.getAttribute('data-sort') != null ? td.getAttribute('data-sort') : td.textContent).trim();
  if (t === '' || t === '-' || t === '–') return { n: true, v: -Infinity };
  const m = t.replace(/,/g, '').match(/^[^\d-]{0,3}(-?\d+(\.\d+)?)/);
  if (m && /^[^A-Za-z]{0,3}-?\d/.test(t)) return { n: true, v: parseFloat(m[1]) };
  return { n: false, v: t.toLowerCase() };
}
function tableKey(tb, i) { const h = tb.rows[0]; return screen + '|' + i + '|' + (h ? h.textContent.replace(/[▲▼]/g, '').slice(0, 80) : ''); }
function sortTable(tb, col, dir) {
  const rows = Array.from(tb.rows), head = rows[0], ncell = head.cells.length;
  const body = rows.slice(1).filter(r => !r.querySelector('th'));
  if (body.some(r => r.cells.length !== ncell)) return false;
  const vals = body.map(r => ({ r, v: cellVal(r.cells[col]) }));
  const num = vals.filter(x => x.n !== false && x.v.n).length >= vals.length / 2;
  vals.sort((a, b) => {
    const x = a.v, y = b.v;
    if (num) { const xv = x.n ? x.v : -Infinity, yv = y.n ? y.v : -Infinity; return (xv - yv) * dir || 0; }
    return String(x.v).localeCompare(String(y.v)) * dir;
  });
  const parent = body.length ? body[0].parentNode : null;
  if (parent) vals.forEach(x => parent.appendChild(x.r));
  Array.from(head.cells).forEach((c, k) => { c.textContent = c.textContent.replace(/ [▲▼]$/, '') + (k === col ? (dir > 0 ? ' ▲' : ' ▼') : ''); });
  return true;
}
function tableSortApply() {
  document.querySelectorAll('#app table').forEach((tb, i) => {
    const head = tb.rows[0]; if (!head || !head.querySelector('th') || tb.rows.length < 3 || tb.classList.contains('nosort')) return;
    const key = tableKey(tb, i);
    Array.from(head.cells).forEach((th, col) => {
      if (!th.textContent.trim()) return;
      th.style.cursor = 'pointer'; th.title = 'Sort';
      if (th.onclick) { const old = th.onclick; th.onclick = e => { delete TSORT[key]; old.call(th, e); }; return; }
      th.onclick = () => {
        const cur = TSORT[key];
        const first = (() => { const v = Array.from(tb.rows).slice(1).map(r => r.cells[col] && cellVal(r.cells[col])).filter(Boolean); return v.filter(x => x.n).length >= v.length / 2 ? -1 : 1; })();
        const dir = cur && cur.col === col ? -cur.dir : first;
        if (sortTable(tb, col, dir)) TSORT[tableKey(tb, i)] = { col, dir };
      };
    });
    const st = TSORT[key]; if (st) { if (!sortTable(tb, st.col, st.dir)) delete TSORT[key]; else TSORT[tableKey(tb, i)] = st; }
  });
}

  if (!h) return `<div class="modal-bg"><div class="modal"><p>${esc(name)} is not in the Hall of Fame.</p><button id="mClose">Close</button></div></div>`;
  const L = h.f ? h.lines : Object.assign({}, h.lines, hofLines(C, name));
  const fmts = [['test', 'Tests'], ['odi', 'ODIs'], ['t20i', 'T20Is'], ['shield', 'Sheffield Shield'], ['odc', 'One-Day Cup'], ['bbl', 'BBL']].filter(([k]) => L[k] && L[k].m);
  const hon = {}; (h.hon || []).forEach(([a, y]) => { (hon[a] = hon[a] || []).push(y); });
  const preNote = !h.f && ['test', 'odi', 't20i'].some(k => L[k] && L[k].pre) ? `<p class="mute sm">Includes his real career before 2026: ${['test', 'odi', 't20i'].filter(k => L[k] && L[k].pre).map(k => `${L[k].pre.m} ${k === 'test' ? 'Tests' : k === 'odi' ? 'ODIs' : 'T20Is'}`).join(', ')}.</p>` : '';
  return `<div class="modal-bg"><div class="modal xl"><div class="top"><div><h2>${esc(h.n)}</h2>
    <div class="mute">${tName(h.nat)} · ${roleWord(h.role)} · ${h.f ? 'Founding member of the Hall of Fame' : `Inducted ${h.y}${h.ry ? `, retired ${seasonTxt(h.ry)}` : ''}`}</div>
    ${h.why && h.why.length ? `<div style="margin-top:6px" class="sm">${esc(h.why.join(', '))}.</div>` : ''}</div>
    ${h.peak ? `<div class="right"><div class="mute sm">Peak rating</div>${badge(h.peak)}${h.peakWB && h.peakWB > h.peak ? ' ' + badge(h.peakWB) + ' <span class="mute sm">white ball</span>' : ''}</div>` : ''}</div>
    <div class="card scroll" style="margin-top:12px"><h3>Career</h3><table><tr><th>Format</th><th class="n">M</th><th class="n">Runs</th><th class="n">Avg</th><th class="n">100s</th><th class="n">Wkts</th><th class="n">Bowl avg</th></tr>
      ${fmts.map(([k, l]) => { const x = L[k]; return `<tr><td>${l}</td><td class="n">${x.m}</td><td class="n">${Math.round(x.runs).toLocaleString('en-AU')}</td><td class="n">${x.avg ? x.avg.toFixed(2) : '-'}</td><td class="n">${x.h100}</td><td class="n">${x.wk}</td><td class="n">${x.wk ? x.bavg.toFixed(2) : '-'}</td></tr>`; }).join('')}</table>${preNote}</div>
    ${Object.keys(hon).length ? `<div class="card"><h3>Honours in your career</h3>${Object.entries(hon).map(([a, ys]) => `<div class="sm">${esc(a)}${ys.length > 1 ? ` x${ys.length}` : ''} <span class="mute">(${ys.join(', ')})</span></div>`).join('')}</div>` : ''}
    <div class="btns"><button id="mClose">Close</button></div></div></div>`;
}
function bind58() {
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach(el => el[ev] = fn);
  on('[data-rcomp]', 'onclick', e => { ui.rcomp = e.currentTarget.dataset.rcomp; render(); });
  on('[data-rsec]', 'onclick', e => { ui.rsec = e.currentTarget.dataset.rsec; render(); });
  on('#rGround', 'onchange', e => { ui.rground = e.target.value; render(); });
  on('[data-hf]', 'onclick', e => { ui.hf = e.currentTarget.dataset.hf; render(); });
  on('[data-hof]', 'onclick', e => { e.stopPropagation(); const n = e.currentTarget.dataset.hof; openModal(() => hofModal(n)); });
}
</script>
<script>// ===== VERSION 5.9: the full editor (hidden dot bottom-left of the Hub, code 1105) =====
const CM_TYPES = [['', 'Does not bowl'], ['RF', 'Right-arm fast'], ['RFM', 'Right-arm fast-medium'], ['RM', 'Right-arm medium'], ['LF', 'Left-arm fast'], ['LFM', 'Left-arm fast-medium'], ['OB', 'Off spin'], ['LB', 'Leg spin'], ['SLA', 'Left-arm orthodox']];
const cmPace = t => ['RF', 'RFM', 'RM', 'LF', 'LFM'].includes(t);
const cmEl = id => document.getElementById(id);
const cmNum = id => { const el = cmEl(id); return el && el.value !== '' && isFinite(+el.value) ? +el.value : null; };
const cmVal = id => { const el = cmEl(id); return el ? el.value : null; };
const cmChk = id => { const el = cmEl(id); return el ? el.checked : null; };
function cmF(id, label, v, step, w) { return `<label class="sm" style="display:inline-block;margin:4px 10px 4px 0">${label}<br><input id="${id}" type="number" step="${step || 1}" value="${v == null ? '' : Math.round(v * 10) / 10}" style="width:${w || 72}px"></label>`; }
function cmS(id, label, opts, cur) { return `<label class="sm" style="display:inline-block;margin:4px 10px 4px 0">${label}<br><select id="${id}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(cur == null ? '' : cur) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`; }
function cmC(id, label, on) { return `<label class="sm" style="display:inline-block;margin:6px 12px 4px 0"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}> ${label}</label>`; }
function cmT(id, label, v, w) { return `<label class="sm" style="display:inline-block;margin:4px 10px 4px 0">${label}<br><input id="${id}" value="${esc(v || '')}" style="width:${w || 160}px" autocomplete="off"></label>`; }
const cmLeagueOf = (name) => { const L = C.leagues && C.leagues.signed; const out = {}; if (L) Object.keys(L).forEach(k => { if (L[k][name]) out[k] = L[k][name]; }); return out; };

// ---- shared moves (all used by the player tab, the team lists and the create tab) ----
function cmSetBBL(p, k) {
  if (!C.bbl) return;
  const cur = CR.bblClubOf(C, p.name) || null; k = k || null; if (cur === k) return;
  if (cur) { const cl = C.bbl.clubs[cur]; cl.squad = cl.squad.filter(n => n !== p.name); if (cl.con) delete cl.con[p.name]; }
  if (k) { const cl = C.bbl.clubs[k]; cl.squad.push(p.name); (cl.con = cl.con || {})[p.name] = { sal: typeof bblValue === 'function' ? bblValue(C, p) : 100000, yrs: 2 }; }
}
function cmSetLeague(p, lg, team) {
  if (!C.leagues || !C.leagues.signed) return;
  const S = C.leagues.signed[lg] || (C.leagues.signed[lg] = {});
  if (team) S[p.name] = team; else delete S[p.name];
}
function cmClearRoles(p, leavingAus) {
  C.contracts = (C.contracts || []).filter(n => n !== p.name);
  if (leavingAus) {
    if (C.captain === p.name) C.captain = null; if (C.vice === p.name) C.vice = null;
    Object.keys(C.captains || {}).forEach(f => { const cc = C.captains[f]; if (cc) C.captains[f] = cc.map(n => n === p.name ? null : n); });
    C.promises = (C.promises || []).filter(x => x.name !== p.name);
    if (C.academy && C.academy.sch) C.academy.sch = C.academy.sch.filter(n => n !== p.name);
  }
}
function cmMoveNation(p, nat, now) {
  if (!nat || nat === p.nat) return;
  const wasAus = p.nat === 'AUS';
  CR.moveNation(C, p, nat, now);
  if (wasAus) cmClearRoles(p, true);
}
function cmSetBowl(p, type) {
  if (!type) { if (p.bowl) { p.bowl = null; if (p.role === 'BOWL' || p.role === 'AR') p.role = 'BAT'; } return; }
  if (!p.bowl) { p.bowl = { type, skill: 40, acc: 40, stam: cmPace(type) ? 70 : 85, death: 35, vars: 35 }; }
  p.bowl.type = type;
  const sk = p.bowl.skill;
  if (cmPace(type)) { if (p.bowl.swing == null) p.bowl.swing = sk; if (p.bowl.seam == null) p.bowl.seam = sk; delete p.bowl.turn; delete p.bowl.flight; }
  else { if (p.bowl.turn == null) p.bowl.turn = sk; if (p.bowl.flight == null) p.bowl.flight = sk; delete p.bowl.swing; delete p.bowl.seam; }
  if (p.bowl.death == null) p.bowl.death = Math.round(sk * 0.8); if (p.bowl.vars == null) p.bowl.vars = Math.round(sk * 0.8);
}
function cmRetirePlayer(p) {
  const L = C.players[p.nat]; const i = L.indexOf(p); if (i >= 0) L.splice(i, 1);
  p.retired = true;
  cmClearRoles(p, p.nat === 'AUS'); cmSetBBL(p, null);
  if (C.leagues && C.leagues.signed) Object.keys(C.leagues.signed).forEach(k => delete C.leagues.signed[k][p.name]);
  try { retireSnapshot(C, p); } catch (e) { console.warn(e); }
  CR.news(C, `${p.name} has retired.`);
}
function cmFinish(p) {
  p.potRaw = Math.max(p.potRaw || 0, E.overall(p));
  p.peak = Math.max(p.peak || 0, E.potential(p)); p.peakWB = Math.max(p.peakWB || 0, E.wbOverall(p, 'odi'), E.wbOverall(p, 't20'));
}

// ---- the modal ----
function cmEditModal() {
  const tab = ui.cmTab || 'player';
  const tabs = [['player', 'Edit a player'], ['teams', 'Team lists'], ['create', 'Create a player'], ['world', 'Career and world']];
  let body = '';
  if (tab === 'player') body = cmPlayerTab(); else if (tab === 'teams') body = cmTeamsTab(); else if (tab === 'create') body = cmCreateTab(); else body = cmWorldTab();
  return `<div class="modal-bg"><div class="modal wide xl"><div class="row"><h2>Editor</h2><span class="mute sm">Changes save straight away.</span></div>
    <div class="tabs">${tabs.map(([k, l]) => `<button data-cmtab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${ui.cmMsg ? `<div class="ok" style="margin-bottom:8px">${esc(ui.cmMsg)}</div>` : ''}${body}
    <div class="btns"><button id="mClose">Close</button></div></div></div>`;
}
function cmPlayerTab() {
  const q = (ui.cmQ || '').toLowerCase().trim();
  const all = CR.NATIONS.flatMap(n => C.players[n]);
  const hits = q.length >= 2 ? all.filter(p => p.name.toLowerCase().includes(q)).slice(0, 25) : [];
  const p = ui.cmP ? CR.P_(C, ui.cmP) : null;
  let body = `<input id="cmSearch" placeholder="Type a player's name (any nation)" value="${esc(ui.cmQ || '')}" style="width:100%" autocomplete="off">
    ${hits.length ? `<div class="sm" style="margin-top:6px">${hits.map(h => `<a class="pl" data-cmpick="${esc(h.name)}" style="display:inline-block;margin:2px 10px 2px 0">${esc(h.name)} <span class="mute">(${h.nat}${h.state ? ' ' + h.state : ''}, ${h.role}, ${E.overall(h)})</span></a>`).join('')}</div>` : q.length >= 2 ? '<div class="mute sm" style="margin-top:6px">No players found.</div>' : ''}`;
  if (!p) return body;
  const b = p.bat, w = p.bowl || {}, club = C.bbl ? CR.bblClubOf(C, p.name) : '';
  const dom = DOM[p.nat] ? [['', 'None']].concat(Object.entries(DOM[p.nat].teams)) : null;
  const lgs = cmLeagueOf(p.name), aus = p.nat === 'AUS';
  const capsLine = aus ? `<h3>Captaincy</h3><div class="btns" style="flex-wrap:wrap;justify-content:flex-start">
      <button data-cmcap="test-c">Test captain</button><button data-cmcap="test-v">Test vice-captain</button><button data-cmcap="odi-c">ODI captain</button><button data-cmcap="odi-v">ODI vice</button><button data-cmcap="t20-c">T20I captain</button><button data-cmcap="t20-v">T20I vice</button></div>
      <div class="mute sm">Now: Test ${esc(C.captain || '-')} (vice ${esc(C.vice || '-')}) · ODI ${esc(((C.captains || {}).odi || [])[0] || '-')} · T20I ${esc(((C.captains || {}).t20 || [])[0] || '-')}</div>` : '';
  body += `<div class="card" style="margin-top:10px"><h3>${esc(p.name)} <span class="mute sm">${tName(p.nat)}${p.state ? ' · ' + STATES[p.state].name : ''} · ${roleName[p.role]} · age ${p.age}</span></h3>
    <p class="sm mute">Now: Test ${E.overall(p)} (POT ${E.potential(p)}) · ODI ${E.wbOverall(p, 'odi')} (POT ${E.wbPotential(p, 'odi')}) · T20 ${E.wbOverall(p, 't20')} (POT ${E.wbPotential(p, 't20')})</p>
    <h3>Teams</h3>
    ${cmS('cmNat', 'Country', CR.NATIONS.map(n => [n, tName(n)]), p.nat)}${cmC('cmNow', 'Eligible to play for them straight away', true)}
    ${cmS('cmState', 'State (if Australian)', CR.STATE_CODES.map(k => [k, STATES[k].name]), p.state || 'NSW')}
    ${dom ? cmS('cmDom', DOM[p.nat].name + ' team', dom, p.dt || '') : ''}
    ${C.bbl ? cmS('cmBBL', 'BBL club', [['', 'None']].concat(CR.BBL_CODES.map(k => [k, BBL_CLUBS[k].name])), club || '') : ''}
    ${typeof LEAGUES !== 'undefined' && C.leagues ? `<div>${LEAGUES.map(lg => cmS('cmLg_' + lg.k, lg.name, [['', 'None']].concat(lg.teams.map(t => [t, t])), lgs[lg.k] || '')).join('')}</div><div class="mute sm">Franchise league signings are redrawn each season.</div>` : ''}
    <div>${cmC('cmCA', 'Cricket Australia contract', (C.contracts || []).includes(p.name))}${cmC('cmWB', 'White-ball only (no Tests)', p.wbOnly)}
    ${cmS('cmIntl', 'Available for', [['all', 'All formats'], ['odi', 'ODIs only (white ball)'], ['t20', 'T20Is only (white ball)'], ['none', 'No internationals']], p.intl || 'all')}
    ${p.noIntl ? cmC('cmQual', `Qualify now (not eligible until ${p.qualY || '?'})`, true) : ''}</div>
    ${capsLine}
    <h3>Quick ratings</h3>${cmF('cmT', 'Test OVR', E.overall(p))}${cmF('cmO', 'ODI OVR', E.wbOverall(p, 'odi'))}${cmF('cmT2', 'T20 OVR', E.wbOverall(p, 't20'))}${cmF('cmPot', 'Potential', E.potential(p))}
    <h3>Player</h3>${cmF('cmAge', 'Age', p.age)}${cmF('cmForm', 'Form (-10 to 10)', p.form || 0)}${cmF('cmMor', 'Morale', p.morale)}${cmF('cmLead', 'Leadership (Test)', p.lead)}${cmF('cmLeadW', 'Leadership (white-ball)', p.leadWB != null ? p.leadWB : p.lead)}
    ${cmS('cmPers', 'Personality', PERS.map(x => [x, x]), CR.persOf(p))}${cmS('cmRole', 'Role', [['BAT', 'Batter'], ['BOWL', 'Bowler'], ['AR', 'All-rounder'], ['WK', 'Keeper']], p.role)}
    ${cmS('cmHand', 'Bats', [['R', 'Right-handed'], ['L', 'Left-handed']], p.hand || 'R')}${cmF('cmProne', 'Injury proneness (0.3 to 3)', p.prone || 1, 0.1, 90)}${cmC('cmOpen', 'Opener', !!p.opener)}
    <h3>Fitness</h3>${cmS('cmInjS', 'Status', [['fit', 'Fit'], ['inj', 'Injured']], p.injury ? 'inj' : 'fit')}${cmF('cmInjW', 'Weeks out', p.injury ? Math.ceil(p.injury.weeks) : 4)}${cmT('cmInjWhat', 'Injury', p.injury ? p.injury.what : 'hamstring strain')}
    ${C.energy && C.energy[p.name] != null ? cmF('cmEn', 'Energy for the next Test', C.energy[p.name]) : ''}
    <h3>Batting</h3>${['tech', 'agg', 'vPace', 'vSpin', 'conc', 'off', 'on', 'power', 'finish'].filter(k => b[k] != null).map(k => cmF('cmb_' + k, k, b[k])).join('')}
    <h3>Bowling</h3>${cmS('cmBType', 'Bowling type', CM_TYPES, w.type || '')}
    ${p.bowl ? ['skill', 'acc', 'stam', 'swing', 'seam', 'turn', 'flight', 'death', 'vars'].filter(k => w[k] != null).map(k => cmF('cmw_' + k, k, w[k])).join('') : '<div class="mute sm">Pick a bowling type to give him bowling (starts at 40, then set the numbers).</div>'}
    <h3>Fielding and keeping</h3>${cmF('cmKeep', 'Keeping', p.keep)}${cmF('cmField', 'Catching', p.field)}${cmF('cmGround', 'Ground fielding', p.ground)}
    <div class="btns"><button class="primary" id="cmSave">Apply</button><button id="cmRetire2">Retire this player</button></div>
    <p class="sm mute">Moves happen first, then hand-edited attributes, then the quick ratings (Test, then ODI and T20).</p></div>`;
  return body;
}
function cmApply() {
  const p = CR.P_(C, ui.cmP); if (!p) return;
  if (!C.contracts) C.contracts = [];
  const before = { t: E.overall(p), o: E.wbOverall(p, 'odi'), t2: E.wbOverall(p, 't20'), pot: E.potential(p) };
  const domBefore = p.nat;
  // 1. teams
  const nat = cmVal('cmNat'); if (nat && nat !== p.nat) cmMoveNation(p, nat, cmChk('cmNow'));
  if (p.nat === 'AUS' && cmVal('cmState')) p.state = cmVal('cmState');
  if (cmVal('cmDom') != null && p.nat === domBefore) { if (cmVal('cmDom')) p.dt = cmVal('cmDom'); else delete p.dt; }
  if (cmVal('cmBBL') != null) cmSetBBL(p, cmVal('cmBBL'));
  if (typeof LEAGUES !== 'undefined') LEAGUES.forEach(lg => { const v = cmVal('cmLg_' + lg.k); if (v != null) cmSetLeague(p, lg.k, v); });
  if (cmChk('cmCA') != null) { const has = C.contracts.includes(p.name); if (cmChk('cmCA') && !has && p.nat === 'AUS') C.contracts.push(p.name); if (!cmChk('cmCA') && has) C.contracts = C.contracts.filter(n => n !== p.name); }
  if (cmChk('cmWB') != null) { if (cmChk('cmWB')) p.wbOnly = true; else delete p.wbOnly; }
  const it = cmVal('cmIntl'); if (it) { if (it === 'all') delete p.intl; else p.intl = it; }
  if (cmChk('cmQual')) { delete p.noIntl; delete p.qualY; }
  // 2. player
  if (cmVal('cmPers')) p.pers = cmVal('cmPers');
  const role = cmVal('cmRole'); if (role && role !== p.role) { p.role = role; if (role === 'WK' && !p.keep) p.keep = 60; if ((role === 'BOWL' || role === 'AR') && !p.bowl) cmSetBowl(p, 'RFM'); }
  if (cmVal('cmHand')) p.hand = cmVal('cmHand');
  const pr = cmNum('cmProne'); if (pr != null) p.prone = clamp(pr, 0.3, 3);
  if (cmChk('cmOpen') != null) { if (cmChk('cmOpen')) p.opener = true; else delete p.opener; }
  const bt = cmVal('cmBType'); if (bt != null && bt !== ((p.bowl || {}).type || '')) cmSetBowl(p, bt);
  // 3. hand-edited attributes
  Object.keys(p.bat).forEach(k => { const v = cmNum('cmb_' + k); if (v != null) p.bat[k] = clamp(v, 1, 99); });
  if (p.bowl) Object.keys(p.bowl).forEach(k => { if (k === 'type') return; const v = cmNum('cmw_' + k); if (v != null) p.bowl[k] = clamp(v, 1, 99); });
  const kp = cmNum('cmKeep'); if (kp != null) p.keep = clamp(kp, 0, 99);
  const fl = cmNum('cmField'); if (fl != null) p.field = clamp(fl, 1, 99);
  const gr = cmNum('cmGround'); if (gr != null) p.ground = clamp(gr, 1, 99);
  // 4. quick ratings
  const t = cmNum('cmT'); if (t != null && t !== before.t) cmSetTest(p, clamp(t, 1, 99));
  const o = cmNum('cmO'); if (o != null && o !== before.o) cmSetWB(p, 'odi', clamp(o, 1, 99));
  const t2 = cmNum('cmT2'); if (t2 != null && t2 !== before.t2) cmSetWB(p, 't20', clamp(t2, 1, 99));
  const pot = cmNum('cmPot'); if (pot != null && pot !== before.pot) p.potRaw = Math.max(E.overall(p), clamp(pot, 1, 99));
  cmFinish(p);
  const ld = cmNum('cmLead'); if (ld != null) p.lead = clamp(ld, 1, 99);
  const lw = cmNum('cmLeadW'); if (lw != null) p.leadWB = clamp(lw, 1, 99);
  const ag = cmNum('cmAge'); if (ag != null) p.age = clamp(Math.round(ag), 15, 45);
  const fo = cmNum('cmForm'); if (fo != null) p.form = clamp(fo, -10, 10);
  const mo = cmNum('cmMor'); if (mo != null) p.morale = clamp(mo, 0, 100);
  // 5. fitness
  if (cmVal('cmInjS') === 'fit') p.injury = null;
  else if (cmVal('cmInjS') === 'inj') p.injury = { what: (cmVal('cmInjWhat') || 'injury').trim() || 'injury', weeks: clamp(cmNum('cmInjW') || 4, 1, 52) };
  const en = cmNum('cmEn'); if (en != null && C.energy) C.energy[p.name] = clamp(en, 45, 100);
  ui.cmMsg = `Saved changes to ${p.name}.`;
  CR.bump(C); save(); openModal(cmEditModal);
}

// ---- team lists: see any state, BBL club or country and move people in bulk ----
function cmListOf(type, key) {
  if (type === 'state') return C.players.AUS.filter(p => p.state === key);
  if (type === 'bbl') return C.bbl ? C.bbl.clubs[key].squad.map(n => CR.P_(C, n)).filter(Boolean) : [];
  return (C.players[key] || []).slice().sort((a, b) => E.overall(b) - E.overall(a)).slice(0, 60);
}
function cmTeamsTab() {
  const type = ui.cmLT || 'state';
  const keys = type === 'state' ? CR.STATE_CODES.map(k => [k, STATES[k].name]) : type === 'bbl' ? CR.BBL_CODES.map(k => [k, BBL_CLUBS[k].name]) : CR.NATIONS.map(n => [n, tName(n)]);
  const key = keys.some(x => x[0] === ui.cmLK) ? ui.cmLK : keys[0][0];
  const list = cmListOf(type, key);
  const dest = type === 'bbl' ? [['', 'No club']].concat(keys) : keys;
  return `<div class="tabs">${[['state', 'States'], ['bbl', 'BBL clubs'], ['nat', 'Countries']].map(([k, l]) => `<button data-cmlt="${k}" class="${k === type ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${type === 'bbl' && !C.bbl ? '<p class="mute">The BBL has not started in this save yet.</p>' : `${cmS('cmLK', 'List', keys, key)}
    <div class="card scroll"><table><tr><th>Player</th><th>Country</th><th>Role</th><th class="n">Age</th><th class="n">Test</th><th class="n">T20</th><th>Move to</th><th></th></tr>
    ${list.map((p, i) => `<tr><td>${esc(p.name)}</td><td>${p.nat}</td><td>${p.role}</td><td class="n">${p.age}</td><td class="n">${E.overall(p)}</td><td class="n">${E.wbOverall(p, 't20')}</td>
      <td><select id="cmMv_${i}">${dest.filter(d => d[0] !== key).map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></td><td><button class="mini" data-cmmove="${esc(p.name)}" data-cmi="${i}">Move</button></td></tr>`).join('')}</table>
    <div class="mute sm" style="margin-top:6px">${list.length} players.${type === 'nat' ? ' Showing the 60 best; moved players can play for their new country straight away.' : ''}${type === 'bbl' ? ` Lists normally hold up to 18, with up to 3 overseas players in an XI.` : ''}</div></div>`}`;
}
function cmMove(name, to) {
  const p = CR.P_(C, name); if (!p) return;
  const type = ui.cmLT || 'state';
  if (type === 'state') { if (p.nat !== 'AUS') return; p.state = to; ui.cmMsg = `${name} moved to ${STATES[to].name}.`; }
  else if (type === 'bbl') { cmSetBBL(p, to || null); ui.cmMsg = to ? `${name} moved to the ${BBL_CLUBS[to].name}.` : `${name} released from his BBL club.`; }
  else { cmMoveNation(p, to, true); ui.cmMsg = `${name} now plays for ${tName(to)}.`; }
  CR.bump(C); save(); openModal(cmEditModal);
}

// ---- create a player ----
function cmCreateTab() {
  const d = ui.cmNew || (ui.cmNew = { nat: 'AUS', state: 'SA', role: 'BAT', bowl: '', hand: 'R', age: 21, t: 70, pot: 85 });
  return `<div class="card"><h3>New player</h3>
    ${cmT('cnName', 'Name', d.name || '', 200)}${cmS('cnNat', 'Country', CR.NATIONS.map(n => [n, tName(n)]), d.nat)}${cmS('cnState', 'State (if Australian)', CR.STATE_CODES.map(k => [k, STATES[k].name]), d.state)}
    ${cmS('cnRole', 'Role', [['BAT', 'Batter'], ['BOWL', 'Bowler'], ['AR', 'All-rounder'], ['WK', 'Keeper']], d.role)}${cmS('cnBowl', 'Bowling', CM_TYPES, d.bowl)}${cmS('cnHand', 'Bats', [['R', 'Right-handed'], ['L', 'Left-handed']], d.hand)}
    <div>${cmF('cnAge', 'Age', d.age)}${cmF('cnT', 'Test OVR', d.t)}${cmF('cnO', 'ODI OVR (blank = automatic)', d.o)}${cmF('cnT2', 'T20 OVR (blank = automatic)', d.t2)}${cmF('cnPot', 'Potential', d.pot)}</div>
    ${C.bbl ? cmS('cnBBL', 'BBL club', [['', 'None']].concat(CR.BBL_CODES.map(k => [k, BBL_CLUBS[k].name])), '') : ''}${cmC('cnCA', 'Cricket Australia contract', false)}
    <div class="btns"><button class="primary" id="cnGo">Create player</button></div>
    <p class="mute sm">He joins the game straight away and develops like everyone else. Find him with the Players tab or the editor search.</p></div>`;
}
function cmCreate() {
  const name = (cmVal('cnName') || '').trim().replace(/\s+/g, ' ');
  const d = ui.cmNew = { name, nat: cmVal('cnNat'), state: cmVal('cnState'), role: cmVal('cnRole'), bowl: cmVal('cnBowl'), hand: cmVal('cnHand'), age: cmNum('cnAge'), t: cmNum('cnT'), o: cmNum('cnO'), t2: cmNum('cnT2'), pot: cmNum('cnPot') };
  if (name.length < 3) { ui.cmMsg = 'Give him a name first.'; openModal(cmEditModal); return; }
  if (CR.P_(C, name) || (C.stats && C.stats[name])) { ui.cmMsg = `There is already a player called ${name}. Pick another name.`; openModal(cmEditModal); return; }
  const role = d.role || 'BAT'; let bowl = d.bowl || (role === 'BOWL' || role === 'AR' ? 'RFM' : '');
  const age = clamp(Math.round(d.age || 21), 15, 45), t = clamp(d.t || 70, 20, 99);
  const p = Q(name, age, role, role === 'BOWL' ? 35 : t - 4, 65, 0, bowl ? `${bowl} ${role === 'BOWL' || role === 'AR' ? t - 2 : 40}` : null, null, { h: d.hand, st: d.nat === 'AUS' ? d.state : null, keep: role === 'WK' ? t : 0 });
  p.nat = d.nat; if (p.nat !== 'AUS') delete p.state;
  wbInit(p); p.wbo = { odi: { bat: 0, bowl: 0 }, t20: { bat: 0, bowl: 0 } };
  cmSetTest(p, t); if (d.o != null) cmSetWB(p, 'odi', clamp(d.o, 20, 99)); if (d.t2 != null) cmSetWB(p, 't20', clamp(d.t2, 20, 99));
  p.potRaw = Math.max(E.overall(p), clamp(d.pot || t, 1, 99));
  p.peak = E.potential(p); p.peakWB = Math.max(E.wbOverall(p, 'odi'), E.wbOverall(p, 't20'));
  p.morale = 70; p.lead = defaultLead(p); p.hist = [{ y: CR.curWindow(C).season, o: E.overall(p), p: E.potential(p) }]; p.sp = { n: 0, sum: 0 }; p.gen = true; p.custom = true;
  C.players[p.nat].push(p);
  if (DOM[p.nat] && C.dom && C.dom[p.nat]) { const tm = Object.keys(DOM[p.nat].teams); p.dt = tm[Math.floor(Math.random() * tm.length)]; }
  if (cmVal('cnBBL')) cmSetBBL(p, cmVal('cnBBL'));
  if (cmChk('cnCA') && p.nat === 'AUS') (C.contracts = C.contracts || []).push(p.name);
  CR.bump(C); save();
  ui.cmMsg = `${name} created: ${tName(p.nat)}${p.state ? ', ' + STATES[p.state].name : ''}, Test ${E.overall(p)}, ODI ${E.wbOverall(p, 'odi')}, T20 ${E.wbOverall(p, 't20')}, potential ${E.potential(p)}.`;
  ui.cmNew = null; ui.cmTab = 'player'; ui.cmP = name; ui.cmQ = name;
  openModal(cmEditModal);
}

// ---- career and world ----
function cmWorldTab() {
  const cm = C.cm || {};
  return `<div class="card"><h3>Career</h3>${cmF('cmConf', 'Board confidence', C.board.conf)}${cmF('cmRep', 'Reputation', C.rep != null ? C.rep : 50)}${C.club ? cmF('cmCap', 'BBL salary cap ($)', C.club.cap, 10000, 110) : ''}
    <div>${cmC('cmNoSack', 'You can never be sacked', cm.noSack)}${cmC('cmNoCap', 'No BBL salary cap or list limit for your club', cm.noCap)}${cmC('cmNoOS', 'No overseas limit in BBL XIs', cm.noOS)}${cmC('cmNoInj', 'No injuries for Australian players', cm.noInj)}</div>
    ${C.sacked ? cmC('cmUnsack', 'Undo your sacking', true) : ''}
    <div class="btns"><button class="primary" id="cmCareer">Apply career changes</button></div></div>
    <div class="card"><h3>Quick actions</h3><div class="btns" style="flex-wrap:wrap;justify-content:flex-start">
      <button data-cmq="healAus">Heal every Australian</button><button data-cmq="healAll">Heal everyone</button><button data-cmq="fresh">Everyone fully rested</button>
      <button data-cmq="moraleAus">Every Australian happy (morale 85)</button><button data-cmq="formAus">Every Australian in form</button></div></div>`;
}
function cmCareerApply() {
  const cf = cmNum('cmConf'); if (cf != null) C.board.conf = clamp(cf, 0, 100);
  const rp = cmNum('cmRep'); if (rp != null) C.rep = clamp(rp, 0, 100);
  if (C.club) { const cap = cmNum('cmCap'); if (cap != null && cap > 0) C.club.cap = cap; }
  C.cm = C.cm || {};
  ['noSack', 'noCap', 'noOS', 'noInj'].forEach(k => { const v = cmChk('cm' + k[0].toUpperCase() + k.slice(1)); if (v != null) { if (v) C.cm[k] = true; else delete C.cm[k]; } });
  if (C.cm.noSack) C.strikes = 0;
  if (cmChk('cmUnsack')) { C.sacked = null; C.strikes = 0; C.board.conf = Math.max(C.board.conf, 30); }
  ui.cmMsg = 'Career settings saved.'; save(); openModal(cmEditModal);
}
function cmQuick(k) {
  const aus = C.players.AUS, all = CR.NATIONS.flatMap(n => C.players[n]);
  if (k === 'healAus') aus.forEach(p => { p.injury = null; });
  if (k === 'healAll') all.forEach(p => { p.injury = null; });
  if (k === 'fresh') C.energy = {};
  if (k === 'moraleAus') aus.forEach(p => { p.morale = 85; });
  if (k === 'formAus') aus.forEach(p => { p.form = Math.max(p.form || 0, 4); });
  ui.cmMsg = { healAus: 'Every Australian is fit.', healAll: 'Everyone is fit.', fresh: 'Everyone is fully rested.', moraleAus: 'Every Australian is happy.', formAus: 'Every Australian is in form.' }[k];
  CR.bump(C); save(); openModal(cmEditModal);
}
function bind59() {
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach(el => el[ev] = fn);
  on('[data-cmtab]', 'onclick', e => { ui.cmTab = e.currentTarget.dataset.cmtab; ui.cmMsg = null; openModal(cmEditModal); });
  on('#cmSave', 'onclick', cmApply);
  on('#cmRetire2', 'onclick', () => { const p = CR.P_(C, ui.cmP); if (!p) return; cmRetirePlayer(p); ui.cmMsg = `${p.name} has been retired.`; ui.cmP = null; CR.bump(C); save(); openModal(cmEditModal); });
  on('[data-cmcap]', 'onclick', e => {
    const p = CR.P_(C, ui.cmP); if (!p || p.nat !== 'AUS') return; const [f, r] = e.currentTarget.dataset.cmcap.split('-');
    if (f === 'test') { if (r === 'c') CR.setCaptain(C, p.name, C.vice === p.name ? null : C.vice); else C.vice = C.captain === p.name ? C.vice : p.name; }
    else { const cur = (C.captains && C.captains[f]) || [null, null]; if (r === 'c') CR.setCaptainWB(C, f, p.name, cur[1] === p.name ? null : cur[1]); else if (cur[0] !== p.name) C.captains[f] = [cur[0], p.name]; }
    ui.cmMsg = `${p.name} is now ${f === 'test' ? 'Test' : f === 'odi' ? 'ODI' : 'T20I'} ${r === 'c' ? 'captain' : 'vice-captain'}.`; save(); openModal(cmEditModal);
  });
  on('[data-cmlt]', 'onclick', e => { ui.cmLT = e.currentTarget.dataset.cmlt; ui.cmLK = null; ui.cmMsg = null; openModal(cmEditModal); });
  on('#cmLK', 'onchange', e => { ui.cmLK = e.target.value; openModal(cmEditModal); });
  on('[data-cmmove]', 'onclick', e => { const n = e.currentTarget.dataset.cmmove, i = e.currentTarget.dataset.cmi; cmMove(n, cmVal('cmMv_' + i)); });
  on('#cnGo', 'onclick', cmCreate);
  on('#cmCareer', 'onclick', cmCareerApply);
  on('[data-cmq]', 'onclick', e => cmQuick(e.currentTarget.dataset.cmq));
}
</script>
