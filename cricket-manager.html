<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cricket Manager</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1f17;--panel:#13291f;--panel2:#183327;--line:#26473a;--ink:#eef3ea;--mute:#9db3a6;--gold:#f2c84b;--red:#ff6b5e;--blue:#7cc4ff;--green:#5fd38d;--cream:#f4ecd8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1d4a35 0,var(--bg) 60%);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
h1,h2,h3,.cond{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em;margin:0}
h1{font-size:34px;font-weight:700}
h2{font-size:24px}
h3{font-size:18px;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.mono{font-family:'JetBrains Mono',monospace}
.mute{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
button{font:600 14px Inter,sans-serif;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer}
button:hover{border-color:var(--gold)}
button.primary{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
button.danger{background:#5a1f1a;border-color:#8a3128}
button:disabled{opacity:.4;cursor:default}
select{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--mute);font-size:13px;cursor:pointer}
table{width:100%;border-collapse:collapse}
th{font:600 11px Inter;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:6px 6px;border-bottom:1px solid #1d3a2e}
td.n,th.n{text-align:right;font-family:'JetBrains Mono',monospace}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:24px;border-radius:6px;font:700 13px 'Barlow Condensed';padding:0 5px}
.b-elite{background:linear-gradient(135deg,#1b1b1b,#3a3220);color:#ffd970;border:1px solid #c9a23a}
.b-gold{background:linear-gradient(135deg,#f6d77a,#c9a03a);color:#2a1e00}
.b-silver{background:linear-gradient(135deg,#e4e8ea,#9aa3a8);color:#1b1f22}
.b-bronze{background:linear-gradient(135deg,#d9a073,#94603a);color:#24130a}
.pot{opacity:.75}
.slot{display:grid;grid-template-columns:24px 1fr 40px 40px;gap:8px;align-items:center;margin-bottom:6px}
.slot select{width:100%}
.warn{color:var(--red);font-size:13px;margin-top:6px}
.ok{color:var(--green);font-size:13px;margin-top:6px}
/* match */
.board{background:linear-gradient(180deg,#0a1711,#10261c);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.scores{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tscore{font-family:'Barlow Condensed';font-size:22px}
.tscore b{font-size:30px;color:var(--cream)}
.status{font-family:'Barlow Condensed';font-size:20px;color:var(--gold);margin-top:6px}
.live{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:620px){.live{grid-template-columns:1fr}}
.liveBox{background:#0b1a13;border:1px solid var(--line);border-radius:10px;padding:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip{min-width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 12px 'JetBrains Mono';background:#22392e;color:var(--mute);padding:0 4px}
.chip.c4{background:#1f4f8a;color:#fff}.chip.c6{background:#6a3fa0;color:#fff}.chip.cW{background:var(--red);color:#fff}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{padding:7px 12px}
.tabs button.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.feed{max-height:560px;overflow:auto}
.ev{padding:8px 10px;border-left:3px solid transparent;border-bottom:1px solid #1d3a2e}
.ev .meta{font-size:11px;color:var(--mute)}
.ev.wkt{border-left-color:var(--red);background:#2a1614}
.ev.mile{border-left-color:var(--gold);background:#2a2614}
.ev.session{border-left-color:var(--blue);background:#132433}
.ev.result{border-left-color:var(--green);background:#14301f;font-weight:600}
.ev.innings,.ev.info{border-left-color:#4a6b5c}
.ev.drop{border-left-color:#d98a3a}
.ev.four,.ev.six{color:#c9d8cf}
.inn-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 4px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:20px;max-width:420px;width:100%}
.modal p{color:var(--mute)}
.modal .btns{display:flex;gap:10px;margin-top:14px}
.banner{background:linear-gradient(90deg,#1f5a39,#14301f);border:1px solid var(--green);border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wear{display:inline-flex;gap:3px;vertical-align:middle}
.wear i{width:10px;height:10px;border-radius:2px;background:#22392e}
.wear i.on{background:#c98f4a}
.sm{font-size:12px}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:rgba(9,22,16,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.nav .logo{font-size:20px;font-weight:700;color:var(--gold);margin-right:10px}
.navb{padding:7px 12px;font-size:13px}.navb.on{border-color:var(--gold);color:var(--gold)}
#saveBtn{margin-left:auto}
.title-screen{max-width:640px;margin:12vh auto;padding:24px;text-align:center}
.big{font-size:64px;line-height:1;margin:10px 0}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.title-screen .btns{justify-content:center}
.hero h2{font-size:30px;margin:4px 0}
.venues{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag.done{opacity:.5;text-decoration:line-through}.tag.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.kpis{display:flex;gap:10px}.kpis div{flex:1;background:#0b1a13;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.kpis b{display:block;font:700 28px 'Barlow Condensed'}.kpis span{font-size:12px;color:var(--mute)}
.calrow{display:grid;grid-template-columns:200px 1fr auto;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid #1d3a2e}
.calrow.past{opacity:.5}.calrow.now{background:#1a3326;border-radius:8px}
@media(max-width:700px){.calrow{grid-template-columns:1fr}}
.right{text-align:right}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
input[type=text],input:not([type]),textarea{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{width:100%;height:120px;font:12px 'JetBrains Mono',monospace;margin-top:8px}
.modal.wide{max-width:560px}
.scroll{overflow-x:auto}
tr.pick{cursor:pointer}tr.pick:hover{background:#1a3326}tr.pick.sel{background:#1d3b2b}
.sticky{position:sticky;bottom:0;background:var(--bg);padding:10px 0}
.warnc{color:var(--red)}.win{color:var(--green);font-weight:600}.loss{color:var(--red);font-weight:600}
.tact{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pb{display:flex;gap:8px;justify-content:flex-end;align-items:center}.bars{display:inline-flex;gap:3px}.bars i{width:14px;height:8px;border-radius:2px;background:#22392e}.bars i.on{background:var(--gold)}
.slot{grid-template-columns:24px 1fr 40px auto}
a.pl{color:var(--ink);cursor:pointer;border-bottom:1px dotted #5a7a6a;text-decoration:none}a.pl:hover{color:var(--gold)}
.fm{font-size:11px;padding:1px 6px;border-radius:99px;font-weight:600}.fm.hot{background:#7a2a12;color:#ffb38a}.fm.good{background:#1f4a2f;color:#8fe0a8}.fm.poor{background:#3a3220;color:#d9b36a}.fm.cold{background:#20304a;color:#8ab4ff}
.inj{font-size:11px;padding:1px 6px;border-radius:4px;background:#5a1f1a;color:#ffb0a8;font-weight:600}
.news{padding:7px 0;border-bottom:1px solid #1d3a2e}.news.big{border-left:3px solid var(--gold);padding-left:8px}.news.good{border-left:3px solid var(--green);padding-left:8px}.news.bad{border-left:3px solid var(--red);padding-left:8px}
.attr{display:grid;grid-template-columns:110px 1fr 30px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.abar{height:8px;background:#22392e;border-radius:4px;overflow:hidden}.abar i{display:block;height:100%}.abar i.e{background:#f2c84b}.abar i.g{background:#c9a03a}.abar i.s{background:#9aa3a8}.abar i.b{background:#94603a}
.modal.xl{max-width:880px;max-height:90vh;overflow:auto}
.grid3c{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}@media(max-width:760px){.grid3c{grid-template-columns:1fr}}
.fc{display:flex;gap:6px;flex-wrap:wrap}.fcd{background:#0b1a13;border:1px solid var(--line);border-radius:8px;padding:4px 8px;text-align:center}
.wx{display:inline-block;width:20px;text-align:center;font-size:15px}.wx.now{outline:2px solid var(--gold);border-radius:4px}
tr.top2 td{background:#16301f}tr.us td{color:var(--gold)}tr.dis{opacity:.45}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
th.sortable{cursor:pointer}th.sortable:hover,th.on{color:var(--gold)}
.navdate{margin-left:auto}#saveBtn{margin-left:8px}
.mor{font-size:11px;padding:1px 6px;border-radius:99px;font-weight:600}.mor{border:1px solid #3a5a4a}.mor.mDelighted{background:#16324a;color:#9fd0ff}.mor.mHappy{background:#16283a;color:#a8c8e8}.mor.mContent{background:#20282e;color:#b8c0c8}.mor.mUnsettled{background:#4a3a1a;color:#e8c070}.mor.mUnhappy{background:#5a1f1a;color:#ffb0a8}
.cap{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--gold);color:#1a1a1a;font-weight:700}.cap.vc{background:#9aa3a8}
.conf{display:flex;gap:10px;align-items:center}.abar.big{flex:1;height:14px;border-radius:7px}.conf b{font:700 22px 'Barlow Condensed'}
.xirow{display:grid;grid-template-columns:22px 1fr 44px auto auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid transparent;border-bottom:1px solid #1d3a2e;border-radius:8px;cursor:pointer}
.xirow:hover{background:#1a3326}.xirow.on{border-color:var(--gold);background:#2a2614}.xirow.bench{cursor:pointer}.xirow.dis{opacity:.45;cursor:default}
.xmain{min-width:0}.en{font:12px 'JetBrains Mono';color:var(--green);text-align:right}.en.low{color:var(--red)}
.xbtns{display:flex;gap:3px}.mini{padding:2px 7px;font-size:11px;border-radius:6px}
tr.crease td{background:#2a2614;color:var(--cream);font-weight:600}
/* ---- white-ball ---- */
.fb{display:inline-block;font:600 11px/1 'Barlow Condensed',sans-serif;letter-spacing:.06em;padding:3px 6px;border-radius:4px;vertical-align:middle;text-transform:uppercase}
.f-test{background:#efe6d2;color:#5b4a1f}.f-odi{background:#d9e8f7;color:#1d4f86}.f-t20{background:#f6dbe6;color:#8a1f4c}
.legs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 2px}
.leg{font-size:12px;padding:3px 8px;border:1px solid var(--line,#ddd);border-radius:999px;opacity:.75}
.leg.on{opacity:1;border-color:var(--gold,#c9a227);font-weight:600}.leg.done{opacity:.55;text-decoration:line-through}
.fboxes{display:flex;gap:10px;justify-content:flex-end}.fbox{text-align:center}.fbox .badge{font-size:15px}
.calfx{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line,#e5e5e5)}.calfx:last-child{border-bottom:0}
.grid2c{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clubs{display:flex;flex-wrap:wrap;gap:6px}.clubs .tag{cursor:pointer}
details summary{cursor:pointer}
.savewarn{background:#5a1f1f;color:#fff;padding:8px 16px;font-size:13px;text-align:center}
.updbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--gold,#c9a227);color:#111;padding:10px 16px;border-radius:10px;font-weight:600;z-index:99;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.updbar button{background:#111;color:#fff;border:0;padding:6px 12px;border-radius:6px;cursor:pointer}
</style>
</head>

<div id="app"></div>

<script>// ===== WORLD DATA =====
// Ratings are our own judgement on a 1-99 scale (FC career mode style), anchored to the ICC rankings of Nov 2026.
// Q(name, age, role, bat, agg, tilt, bowl, pot, x)
//   bat = batting level, agg = aggression, tilt = + better vs pace / - better vs spin, bowl = 'TYPE skill'
//   x: h (L/R), keep, field (catching), ground, peak (career-best OVR, used for regens), form (-10..10),
//      off, on (scoring areas), swing, seam (pace), turn, flight (spin), acc, stam, prone (injury), st (state)
// Bowling types: RF, RFM, RM, LF, LFM (pace) and OB, LB, SLA (spin)

function hashN(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 2001) / 1000 - 1; }
const r1 = v => Math.round(v * 10) / 10;

function Q(name, age, role, bat, agg, tilt, bowl, pot, x) {
  x = x || {};
  const v = k => hashN(name + k);
  const conc = bat + (agg < 55 ? 2 : agg > 80 ? -2 : 0) + v('c') * 2;
  const tl = tilt + v('t') * 2;
  const sv = v('s');
  const p = {
    name, age, role, nat: x.nat, state: x.st || null, hand: x.h || 'R',
    bat: { tech: r1(bat + 1 + v('k') * 1.5), agg, vPace: r1(bat + tl), vSpin: r1(bat - tl), conc: r1(conc),
      off: r1(x.off != null ? x.off : bat + sv * 4), on: r1(x.on != null ? x.on : bat - sv * 4) },
    bowl: null, keep: x.keep || (role === 'WK' ? 80 : 0),
    field: r1(x.field || ((role === 'BOWL' ? 70 : 77) + v('f') * 5)), ground: 0,
    potRaw: pot || null, peak: x.peak || null, form: x.form || 0, prone: x.prone || 1, injury: null,
  };
  p.ground = r1(x.ground || p.field - 2 + v('g') * 4);
  if (bowl) {
    const [type, s] = bowl.split(' '); const sk = +s;
    const pace = ['RF', 'RFM', 'RM', 'LF', 'LFM'].includes(type);
    const mv = v('m');
    p.bowl = { type, skill: sk, acc: sk + (x.acc || 0), stam: x.stam || (pace ? 76 : 88) };
    if (pace) { p.bowl.swing = r1(x.swing || sk + mv * 6); p.bowl.seam = r1(x.seam || sk - mv * 6); }
    else { p.bowl.turn = r1(x.turn || sk + mv * 5); p.bowl.flight = r1(x.flight || sk - mv * 5); }
  }
  return p;
}

function wbInit(p) {
  const o = Object.assign({}, WB_OVR[p.name] || {}, p.wb0 || {});
  const b = p.bat, bl = (b.tech + b.conc + b.vPace + b.vSpin) / 4;
  if (b.power == null) b.power = Math.round(o.power || Math.min(97, b.agg * 0.6 + bl * 0.35 + hashN(p.name + 'pw') * 5));
  if (b.finish == null) b.finish = Math.round(o.finish || Math.min(95, b.agg * 0.35 + bl * 0.6 + hashN(p.name + 'fn') * 5));
  if (p.bowl) {
    const w = p.bowl;
    if (w.death == null) w.death = Math.round(o.death || w.skill * 0.55 + w.acc * 0.35 + hashN(p.name + 'dt') * 5 - (['OB', 'LB', 'SLA'].includes(w.type) ? 4 : 0));
    if (w.vars == null) w.vars = Math.round(o.vars || w.skill * 0.7 + hashN(p.name + 'vr') * 6);
  }
  delete p.wb0;
  return p;
}

  const fW = fld === 'attack' ? 1.18 : fld === 'defend' ? 0.82 : 1, fR = fld === 'attack' ? 1.15 : fld === 'defend' ? 0.82 : 1;
  const bpw = K.base * Math.exp(d > 0 ? K.up * d : K.down * d);
  const pW = (1 / bpw) * setM * (0.8 + bat.bat.agg / 250) * apW * fW;

  if (rnd() < pW) { dismissal(m, bowler, bat, fig); endOverCheck(m); return; }
  if (rnd() < 0.0004 + (110 - avgGround(bw)) * 0.000005) { runOut(m, bowler); endOverCheck(m); return; }

  const early = b < 15 ? 0.55 + bat.bat.agg / 200 : 1;
  const sc = bat.bat.off * 0.5 + bat.bat.on * 0.5, weak = Math.min(bat.bat.off, bat.bat.on);
  const regionF = 1 + ((sc * 0.75 + weak * 0.25) - batRating(bat)) * 0.012 - (bb.acc - 75) * 0.002;
  const groundF = 1 - (avgGround(bw) - 76) * 0.004;
  const mult = Math.exp(0.012 * d) * (0.55 + bat.bat.agg / 110) * apR * fR * (1 + m.venue.flat * 0.02) * early * regionF * groundF;
  const p6 = 0.004 * mult * mult * (bat.bat.agg / 60);
  const probs = [0.16 * mult, 0.037 * mult, 0.006 * mult, 0.065 * mult, p6];
  const r = rnd(); let acc = 0, runs = 0;
  const vals = [1, 2, 3, 4, 6];
  for (let i = 0; i < 5; i++) { acc += probs[i]; if (r < acc) { runs = vals[i]; break; } }
  if (runs === 0 && rnd() < 0.011) {
    const lb = rnd() < 0.7, x = lb ? 1 : pickW([1, 4], [3, 1]);
    inn.runs += x; inn.part.runs += x; inn.extras[lb ? 'lb' : 'b'] += x; m.overLog.push(x + (lb ? 'lb' : 'b'));
    if (x % 2) swapStrike(m);
  } else {
    addRuns(m, runs, bat, bowler, fig, card);
  }
  // batter injury (hit, strain)
  if (rnd() < 0.00012) hurt(m, bat, inn.bat, pick(['a finger injury', 'a hamstring strain', 'a blow to the hand']));
  endOverCheck(m);
}
function avgGround(team) { if (team._g == null) team._g = team.players.reduce((a, p) => a + p.ground, 0) / team.players.length; return team._g; }

function hurt(m, p, teamIdx, what) {
  if (p.hurt) return;
  p.hurt = what;
  m.injuries.push({ name: p.name, team: m.teams[teamIdx].code, what });
  log(m, 'drop', `Injury: ${p.name} picks up ${what}.${p.bowl ? ' He won\'t bowl again in this match.' : ''}`, { team: teamIdx });
}

function addRuns(m, runs, bat, bowler, fig, card) {
  const inn = cur(m);
  const before = card.runs, pBefore = inn.part.runs;
  inn.runs += runs; card.runs += runs; fig.runs += runs; m.overRuns += runs; inn.part.runs += runs; bat.matchRuns += runs;
  m.overLog.push(runs === 0 ? '·' : String(runs));
  if (runs === 4) { card.fours++; boundaryText(m, bat, bowler, 4); }
  if (runs === 6) { card.sixes++; boundaryText(m, bat, bowler, 6); }
  for (const ms of [50, 100, 150, 200, 250, 300]) if (before < ms && card.runs >= ms) {
    log(m, 'mile', `${ms === 50 ? 'Fifty' : ms === 100 ? 'HUNDRED' : ms + ''} for ${bat.name}! ${card.runs} off ${card.balls} balls${ms >= 100 ? ', a superb innings' : ''}.`, { team: inn.bat });
  }
  for (const ms of [100, 150, 200, 250]) if (pBefore < ms && inn.part.runs >= ms) {
    const a = batTeam(m).players[m.striker], b2 = batTeam(m).players[m.nonStriker];
    log(m, 'mile', `${ms} partnership between ${surname(a.name)} and ${surname(b2.name)}.`, { team: inn.bat });
  }
  if (inn.num === 4 && inn.runs >= m.target) return;
  if (runs % 2 === 1) swapStrike(m);
}

const FOUR_TXT = { off: ['driven through the covers for four', 'cut hard past point for four', 'punched off the back foot through cover', 'edged, but it flies between slip and gully for four'],
  on: ['pulled away to the boundary', 'flicked off the pads for four', 'clipped through midwicket for four', 'driven straight down the ground for four'] };
const SIX_TXT = ['launched over long-on for SIX', 'hooked into the crowd for SIX', 'down the track and over the sightscreen for SIX', 'slog-swept into the stands for SIX'];
function boundaryText(m, bat, bowler, n) {
  if (m.quiet) return;
  const side = rnd() < bat.bat.off / (bat.bat.off + bat.bat.on) ? 'off' : 'on';
  let txt = n === 4 ? pick(FOUR_TXT[side]) : pick(SIX_TXT);
  if (bowler.bowl && !isPace(bowler.bowl.type) && txt.includes('hooked')) txt = 'swept into the crowd for SIX';
  log(m, n === 4 ? 'four' : 'six', `${surname(bowler.name)} to ${surname(bat.name)}: ${txt}.`, { team: cur(m).bat });
}

function pickFielder(team, exclude, top) {
  const c = team.players.filter(p => !exclude.includes(p.idx));
  if (top) { c.sort((a, b) => b.field - a.field); return c[Math.floor(rnd() * Math.min(3, c.length))]; }
  return pickW(c, c.map(p => p.field));
}
function fstat(m, ti, pi) { const f = m.fstats[ti]; return f[pi] || (f[pi] = { ct: 0, st: 0, ro: 0, drops: 0 }); }

function dismissal(m, bowler, bat, fig) {
  const inn = cur(m), bw = bowlTeam(m), pace = isPace((bowler.bowl || PT).type);
  const keeper = bw.players[bw.keeper];
  const kinds = ['cb', 'slip', 'field', 'bowled', 'lbw', 'st', 'cab'];
  const sw = bowler.bowl ? (pace ? (bowler.bowl.seam - 70) * 0.2 : (bowler.bowl.turn - 70) * 0.15) : 0;
  const w = pace ? [27 + sw, 15 + sw, 22, 17, 18, 0, 1] : [6, 8, 34, 16 + sw, 24 + sw, 8, 4];
  const k = pickW(kinds, w);
  let fielder = null, how = '', txt = '';
  const B = surname(bowler.name), N = surname(bat.name);
  if (k === 'cb' || k === 'slip' || k === 'field' || k === 'cab') {
    fielder = k === 'cb' ? keeper : k === 'cab' ? bowler : k === 'slip' ? pickFielder(bw, [bowler.idx, bw.keeper], true) : pickFielder(bw, [bowler.idx, bw.keeper]);
    const dropP = k === 'cb' ? (100 - fielder.keep) / 300 : k === 'slip' ? (100 - fielder.field) / 220 : (100 - fielder.field) / 260;
    if (rnd() < dropP) {
      fstat(m, inn.bowl, fielder.idx).drops++;
      log(m, 'drop', `DROPPED! ${N} edges ${B} and ${fielder.name} puts it down. ${N} on ${inn.cards[m.striker].runs}.`, { team: inn.bowl });
      m.overLog.push('·'); return false;
    }
    fstat(m, inn.bowl, fielder.idx).ct++;
    const F = surname(fielder.name);
    if (k === 'cab') { how = `c & b ${B}`; txt = `Caught and bowled! ${B} takes a sharp return catch.`; }
    else if (k === 'cb') { how = `c ${F} b ${B}`; txt = pace ? `Edged and gone! ${F} takes it behind the stumps.` : `Gets a thin edge, ${F} gathers it behind.`; }
    else if (k === 'slip') { how = `c ${F} b ${B}`; txt = `Nicked, and ${F} holds on at ${pace ? 'slip' : 'short leg'}.`; }
    else {
      const pos = pace ? ['gully', 'point', 'mid-off', 'mid-on', 'fine leg', 'square leg', 'cover', 'deep backward square'] : ['long-on', 'deep midwicket', 'mid-off', 'cover', 'silly point', 'long-off', 'deep square leg'];
      how = `c ${F} b ${B}`; txt = `Picks out ${F} at ${pick(pos)}.`;
    }
  } else if (k === 'bowled') { how = `b ${B}`; txt = pick(['Bowled him! Through the gate and the stumps are rearranged.', 'Clean bowled, off stump cartwheeling.', 'Plays down the wrong line and loses his off stump.']); }
  else if (k === 'lbw') { how = `lbw b ${B}`; txt = pick(['Trapped in front! The finger goes up.', 'Pinned on the crease, given out lbw.', 'Big appeal... given! Hitting middle.']); }
  else { fstat(m, inn.bowl, bw.keeper).st++; how = `st ${surname(keeper.name)} b ${B}`; txt = `Down the track, beaten in flight, and ${surname(keeper.name)} whips the bails off.`; }
  fig.wkts++; bowler.matchWkts++;
  inn.cards[m.striker].bowler = bowler.idx;
  outBatter(m, m.striker, how, `${B} to ${N}, OUT! ${txt}`);
  if (fig.wkts === 5) log(m, 'mile', `Five-wicket haul for ${bowler.name}!`, { team: inn.bowl });
  if (bowler.matchWkts === 10) log(m, 'mile', `Ten wickets in the match for ${bowler.name}!`, { team: inn.bowl });
  return true;
}

function runOut(m, bowler) {
  const bw = bowlTeam(m), f = pickFielder(bw, [bowler.idx]);
  fstat(m, cur(m).bowl, f.idx).ro++;
  const who = rnd() < 0.5 ? m.striker : m.nonStriker;
  outBatter(m, who, `run out (${surname(f.name)})`, `RUN OUT! A terrible mix-up and ${surname(f.name)} hits direct. ${surname(batTeam(m).players[who].name)} has to go.`);
}

function outBatter(m, who, how, txt) {
  const inn = cur(m), bt = batTeam(m), c = inn.cards[who];
  c.status = 'out'; c.how = how; inn.wkts++;
  inn.fow.push({ wkt: inn.wkts, runs: inn.runs, name: bt.players[who].name, over: oversStr(inn.legal) });
  m.overLog.push('W'); m.lastWicketFlag = true;
  log(m, 'wkt', `${txt} ${surname(bt.players[who].name)} ${c.runs} (${c.balls}).`, { team: inn.bowl });
  inn.part = { runs: 0, balls: 0 };
  if (inn.wkts >= 10) { endInnings(m, 'allout'); return; }
  nightwatchCheck(m, inn, bt);
  const next = inn.order[m.nextIn++];
  inn.cards[next].status = 'batting';
  if (who === m.striker) m.striker = next; else m.nonStriker = next;
}

function nightwatchCheck(m, inn, bt) {
  const left = m.dayBalls - m.ballsInDay;
  if (left > 42 || inn.wkts >= 7 || m.nextIn > 6) return;
  if (inn.num === 4 && m.target - inn.runs < 80) return;
  if (inn.bat === m.user && bt.nightwatch === 'never') return;
  if (m.day >= m.days) return;
  const nextP = bt.players[inn.order[m.nextIn]];
  if (!nextP || batRating(nextP) < 65) return;
  const cands = inn.order.slice(m.nextIn + 1).filter(i => inn.cards[i].status === 'dnb' && bt.players[i].role === 'BOWL');
  if (!cands.length) return;
  const nw = cands.sort((a, b) => (bt.players[b].bat.tech + bt.players[b].bat.conc) - (bt.players[a].bat.tech + bt.players[a].bat.conc))[0];
  inn.order.splice(inn.order.indexOf(nw), 1);
  inn.order.splice(m.nextIn, 0, nw);
  log(m, 'info', `Nightwatchman: ${bt.players[nw].name} comes in ahead of ${nextP.name} with ${Math.ceil(left / 6)} over${Math.ceil(left / 6) === 1 ? "" : "s"} left in the day.`);
}

function swapStrike(m) { const t = m.striker; m.striker = m.nonStriker; m.nonStriker = t; }

// ---------- Over / time ----------
function endOverCheck(m) {
  if (m.phase !== 'live') return;
  const inn = cur(m);
  if (inn.num === 4 && inn.runs >= m.target) { finish(m, inn.bat, `${m.teams[inn.bat].name} win by ${10 - inn.wkts} wicket${10 - inn.wkts === 1 ? '' : 's'}`); return; }
  if (m.overBalls < 6) return;
  const bw = bowlTeam(m), bowler = bw.players[m.endBowler[m.end]];
  const fig = inn.bowling[bowler.idx];
  m.oversDone++;
  if (m.overRuns === 0 && fig) fig.maidens++;
  bowler.spell++;
  const bt = bowler.bowl || PT, pace = isPace(bt.type);
  const hot = wxNow(m) === 'Sunny' || wxNow(m) === 'Humid' ? 1.15 : 1;
  bowler.energy = clamp(bowler.energy - (pace ? 3 + (100 - bt.stam) * 0.06 : 1 + (100 - bt.stam) * 0.04) * hot, 0, 100);
  bw.players.forEach(p => { if (p !== bowler && p.idx !== m.endBowler[1 - m.end]) p.energy = clamp(p.energy + 2, 0, 100); });
  if (pace && rnd() < 0.0011 * (1 + Math.max(0, 70 - bowler.energy) / 25) * (bowler.prone || 1)) hurt(m, bowler, inn.bowl, pick(['a hamstring strain', 'a side strain', 'back soreness', 'an ankle injury', 'a calf strain']));
  m.lastOver = { bowler: bowler.name, log: m.overLog.slice() };
  m.overBalls = 0; m.overRuns = 0; m.overLog = [];
  swapStrike(m);
  m.end = 1 - m.end;
  if (m.ballAge >= 480 && m.ballAge < 486) newBallDecision(m);
  if (m.stumpsEarly && m.ballsInDay >= m.stumpsEarly) { log(m, 'session', 'Bad light ends play early.'); m.ballsInDay = m.dayBalls; m.stumpsEarly = null; }
  rollTime(m);
  if (m.phase !== 'live') return;
  if (cur(m).bat !== m.user || m.autoDeclare) aiDeclare(m);
  if (m.phase !== 'live' || cur(m) !== inn) return;
  m.endBowler[m.end] = chooseBowler(m, m.end);
}

function newBallDecision(m) {
  const inn = cur(m), bw = bowlTeam(m);
  const bestPace = Math.max(0, ...bw.players.filter(p => p.bowl && isPace(p.bowl.type)).map(p => p.bowl.skill));
  const bestSpin = Math.max(0, ...bw.players.filter(p => p.bowl && !isPace(p.bowl.type)).map(p => effBowl(m, p, inn.bowl)));
  if (bestSpin - (bestPace + m.venue.pace) > 6) return;
  m.ballAge = 0; m.endBowler = [null, null];
  log(m, 'info', `${bw.name} take the second new ball.`);
}

function startSessionWeather(m) {
  const s = sessionIdx(m), w = m.wx[s] || 'Sunny';
  m.hot = w === 'Sunny' ? 1.1 : 1;
  if (w === 'Rain') {
    const frac = 0.3 + rnd() * 0.7;
    const sessEnd = (Math.floor(m.ballsInDay / m.sessBalls) + 1) * m.sessBalls;
    const lost = Math.min(sessEnd - m.ballsInDay, Math.round(m.sessBalls * frac / 6) * 6);
    if (lost > 0) {
      log(m, 'session', lost >= sessEnd - m.ballsInDay ? `Rain. The whole session is washed out.` : `Rain delay: ${lost / 6} overs lost.`);
      m.ballsInDay += lost;
      m.lostOvers = (m.lostOvers || 0) + lost / 6;
    }
  }
  if (s % 3 === 2 && (w === 'Overcast' || w === 'Rain') && rnd() < 0.35) m.stumpsEarly = m.dayBalls - 6 * (4 + Math.floor(rnd() * 14));
}

function rollTime(m) {
  for (let guard = 0; guard < 6; guard++) {
    if (m.ballsInDay >= m.dayBalls) {
      sessionBreak(m, 2);
      m.day++; m.ballsInDay = 0; m.stumpsEarly = null;
      m.sessSeen = sessionIdx(m);
      m.teams.forEach(t => t.players.forEach(p => { p.energy = 100; p.spell = 0; }));
      m.endBowler = [null, null];
      if (m.day > m.days) { finish(m, -1, 'Match drawn'); return; }
      log(m, 'info', `Day ${m.day} under way. ${m.wx[sessionIdx(m)]}.`);
      startSessionWeather(m);
      continue;
    }
    const s = sessionIdx(m);
    if (s > m.sessSeen) {
      sessionBreak(m, (s - 1) % 3);
      m.sessSeen = s;
      m.teams.forEach(t => t.players.forEach(p => { p.energy = clamp(p.energy + 20, 0, 100); p.spell = 0; }));
      m.endBowler = [null, null];
      startSessionWeather(m);
      continue;
    }
    break;
  }
}

function sessionBreak(m, s) {
  if (m.quiet || !m.innings.length || m.phase === 'done') return;
  const name = ['Lunch', 'Tea', 'Stumps'][s];
  const inn = cur(m), bt = m.teams[inn.bat];
  let txt = `${name}, Day ${m.day}: ${bt.short} ${scoreLine(inn)} (${oversStr(inn.legal)} ov)`;
  if (!inn.closed) {
    const a = inn.cards[m.striker], b = inn.cards[m.nonStriker];
    txt += `. ${surname(bt.players[m.striker].name)} ${a.runs}*, ${surname(bt.players[m.nonStriker].name)} ${b.runs}*`;
  }
  log(m, 'session', txt + '. ' + situation(m) + '.');
}

function situation(m) {
  const inn = cur(m), n = m.innings.length;
  if (n === 4) { const need = m.target - inn.runs; return `${m.teams[inn.bat].short} need ${need} more with ${10 - inn.wkts} wickets left`; }
  const L = teamTotal(m, inn.bat) - teamTotal(m, inn.bowl);
  if (n === 1) return `${m.teams[inn.bat].short} batting first`;
  if (L > 0) return `${m.teams[inn.bat].short} lead by ${L}`;
  if (L < 0) return `${m.teams[inn.bat].short} trail by ${-L}`;
  return 'Scores level';
}

// ---------- Declarations / follow-on ----------
function aiDeclare(m) {
  const inn = cur(m), n = m.innings.length, O = oversLeft(m);
  if (n === 4) return;
  const L = teamTotal(m, inn.bat) - teamTotal(m, inn.bowl);
  const sc = m.days === 4 ? 0.85 : 1;
  let dec = false;
  if (n === 1) dec = inn.runs >= 620 * sc || (inn.runs >= 540 * sc && inn.wkts >= 7);
  if (n === 2) dec = L >= 250 && inn.runs >= 550 * sc && O < 200 * sc;
  if (n === 3) dec = (O > 150 * sc && L >= 650 * sc) || (O <= 150 * sc && O >= 45 && L >= declareTarget(O, m)) || (O >= 20 && O < 45 && L >= 4 * O + 60);
  if (dec) declare(m);
}
function declare(m) {
  const inn = cur(m);
  inn.declared = true; inn.declDay = m.day; m.declareRequested = false;
  log(m, 'info', `DECLARATION! ${m.teams[inn.bat].name} declare on ${inn.wkts}/${inn.runs}.`);
  endInnings(m, 'declared');
}

function endInnings(m, why) {
  const inn = cur(m); inn.closed = true;
  inn.cards.forEach(c => { if (c.status === 'batting') { c.status = 'notout'; c.how = 'not out'; } });
  const n = m.innings.length, bt = m.teams[inn.bat];
  if (why === 'allout') log(m, 'innings', `${bt.name} all out for ${inn.runs} (${oversStr(inn.legal)} ov).`);
  if (n === 1) { startInnings(m, inn.bowl, false); return; }
  if (n === 2) {
    const lead = m.innings[0].runs - inn.runs, leader = m.innings[0].bat;
    const foLimit = m.days === 4 ? 150 : 200;
    if (lead >= foLimit) {
      if (leader === m.user) { m.pending = { kind: 'followon', lead }; m.phase = 'decide'; return; }
      followOnDecision(m, lead >= 300 || oversLeft(m) < 210 * m.days / 5);
      return;
    }
    startInnings(m, leader, false); return;
  }
  if (n === 3) {
    const t3 = inn.bat, other = inn.bowl, diff = teamTotal(m, other) - teamTotal(m, t3);
    if (diff > 0) { finish(m, other, `${m.teams[other].name} win by an innings and ${diff} runs`); return; }
    m.target = -diff + 1;
    startInnings(m, other, false); return;
  }
  const need = m.target - 1 - inn.runs;
  if (need === 0) finish(m, -1, 'Match tied!');
  else finish(m, inn.bowl, `${m.teams[inn.bowl].name} win by ${need} run${need === 1 ? '' : 's'}`);
}

function followOnDecision(m, enforce) {
  const leader = m.innings[0].bat;
  m.pending = null; m.phase = 'live';
  log(m, 'info', enforce ? `${m.teams[leader].name} enforce the follow-on!` : `${m.teams[leader].name} decide not to enforce the follow-on, and will bat again.`);
  startInnings(m, enforce ? 1 - leader : leader, enforce);
}

function finish(m, winner, text) {
  if (m.phase === 'done') return;
  m.phase = 'done'; m.result = { winner, text };
  if (m.innings.length) cur(m).cards.forEach(c => { if (c.status === 'batting') { c.status = 'notout'; c.how = 'not out'; } });
  log(m, 'result', text + '.');
}

// ---------- Sim controls ----------
function simUntil(m, unit, n) {
  if (m.lo) return loSimUntil(m, unit, n);
  const start = { inns: m.innings.length, sess: sessionIdx(m), day: m.day, ev: m.events.length };
  const od0 = m.oversDone;
  m.lastWicketFlag = false;
  let guard = 0;
  while (m.phase === 'live' && guard++ < 6000) {
    simBall(m);
    if (m.phase !== 'live') break;
    if (unit === 'ball') break;
    const od = m.oversDone - od0;
    if (unit === 'over' && od >= 1) break;
    if (unit === 'overs' && od >= n) break;
    if (unit === 'session' && sessionIdx(m) !== start.sess) break;
    if (unit === 'day' && m.day !== start.day) break;
    if (unit === 'innings' && m.innings.length !== start.inns) break;
    if (m.stopOnWicket && m.lastWicketFlag && unit !== 'over') break;
    if (m.pauseEachOver && od >= 1 && cur(m).bowl === m.user && m.teams[m.user].bowlMode === 'manual' && unit !== 'over') break;
  }
  return m.events.length - start.ev;
}
function simQuick(m) {
  if (m.lo) return loSimQuick(m);
  // AI vs AI: resolve toss/follow-on and run to the end
  for (let g = 0; g < 20 && m.phase !== 'done'; g++) {
    if (m.phase === 'decide') { if (m.pending.kind === 'toss') tossDecision(m, 'bat'); else followOnDecision(m, true); }
    simUntil(m, 'match');
  }
}

const Engine = { K, WX, WX_ICON, createMatch, tossDecision, followOnDecision, simUntil, simQuick, simBall, overall, overallRaw, potential, batRating, bowlRating, fieldRating,
  oversStr, scoreLine, teamTotal, oversLeft, surname, isPace, situation, autoApproach, approachOf, cur, effBowl, wear, setPlan, fieldOf, maxSpell, wxNow, sessionIdx, mov };
if (typeof module !== 'undefined') { global.CLIMATE = require('./data.js').CLIMATE; module.exports = Engine; }
</script>
<script>// ===== LIMITED-OVERS ENGINE (ODI and T20) =====
const LO = {
  odi: { overs: 50, cap: 10, pp: 10, death: 40, w0: 0.0175, p1: 0.31, p2: 0.07, p4: 0.097, p6: 0.023, wd: 0.016, par: 5.6, name: 'ODI' },
  t20: { overs: 20, cap: 4, pp: 6, death: 15, w0: 0.0235, p1: 0.31, p2: 0.07, p4: 0.093, p6: 0.031, wd: 0.022, par: 7.9, name: 'T20' },
};
const LOK = { off: -4, up: 0.025, run: 0.011 };
const LO_COMPS = ['odi', 't20i', 'odc', 'bbl'];

}
function matchSummary(m) {

// ---------- Background internationals ----------
function simTest(c, home, away, venueKey, opt) {

  const sq = code => autoSquad(c.players[code], 15).sort((x, y) => c.players[code].indexOf(x) - c.players[code].indexOf(y));
  const xiOf = code => autoXI(sq(code), venue, c.energy).map(n => P_(c, n));
  const m = createMatch({ home, away, venue, venueKey, xi: { [home]: xiOf(home), [away]: xiOf(away) }, userTeam: 'none', TEAMS, quiet: true, neutral: !!opt.neutral, comp: 'test' });
  simQuick(m);
  recordMatch(c, m, 'test', { awayTeam: 1, final: opt.final });
  return m;
}
function simSeries(c, home, away, n) {
  c.energy = {};
  const vs = venuesOf(home), res = { home, away, n, w: { [home]: 0, [away]: 0 }, d: 0 };
  for (let i = 0; i < n; i++) {
    const m = simTest(c, home, away, vs[(i + rint(0, 9)) % vs.length]);
    if (m.result.winner === -1) res.d++; else res.w[m.teams[m.result.winner].code]++;
  }
  c.energy = {};
  const hw = res.w[home], aw = res.w[away];
  res.text = hw > aw ? `${TEAMS[home].name} beat ${TEAMS[away].name} ${hw}-${aw}` : aw > hw ? `${TEAMS[away].name} won ${aw}-${hw} in ${TEAMS[home].name}` : `${TEAMS[home].name} v ${TEAMS[away].name} drawn ${hw}-${aw}`;
  return res;
}
const PRESET_BG = { '2026-sum': [['NZ', 'IND', 2], ['PAK', 'SL', 2]] };
function backgroundTests(c, w) {
  if (w.id === 'wtcf' || w.id === 'anniv') return;
  const busy = new Set(['AUS']); if (w.fixture) busy.add(w.fixture.opp);
  const series = [];
  (PRESET_BG[w.key] || []).forEach(([h, a, n]) => { series.push([h, a, n]); busy.add(h); busy.add(a); });
  const free = shuffle(NATIONS.filter(n => !busy.has(n)));
  while (free.length >= 2) {
    const a = free.pop(), b = free.pop();
    const strong = WTC_TEAMS.includes(a) && WTC_TEAMS.includes(b);
    const home = Math.random() < 0.5 ? a : b;
    series.push([home, home === a ? b : a, strong ? rint(2, 3) : 2]);
  }
  series.forEach(([h, a, n]) => {
    const r = simSeries(c, h, a, n);
    c.intl.unshift({ when: `${w.label} ${seasonLabel(w.season)}`, text: r.text, tests: n });
  });

// ---------- Time ----------
function passWeeks(c, wk) {

    if (p.injury) { p.injury.weeks -= wk; if (p.injury.weeks <= 0) { p.injury = null; if (p.nat === 'AUS' && overall(p) >= 74) news(c, `${p.name} is fit again.`, 'good'); } }
  }));
}
function randomInjuries(c, weeks) {
  NATIONS.forEach(code => c.players[code].forEach(p => {
    if (p.injury || p.retired) return;
    const pace = p.bowl && isPace(p.bowl.type);
    if (Math.random() < weeks * 0.0018 * (pace ? 1.6 : 0.8) * (p.prone || 1)) {
      const what = pick(pace ? ['back stress', 'side strain', 'hamstring strain', 'ankle injury'] : ['hamstring strain', 'broken finger', 'calf strain']);
      p.injury = { what, weeks: what.includes('back') ? rint(6, 16) : rint(2, 7) };
      if (p.nat === 'AUS' && overall(p) >= 72) news(c, `Injury: ${p.name} has a ${what}, out for about ${Math.round(p.injury.weeks)} weeks.`, 'bad');
    }
  }));
}

function activateWindow(c) {

  if (w.event && !w.wcMade) { w.wcMade = true; w.wb.push(makeWC(c, w)); news(c, `The ${w.event.name} is next, hosted by ${w.event.host.map(h => TEAMS[h].name).join(' and ')}. Name your squad.`, 'big'); }

  }

  if (bs && c.bbl && bs.pre.length) { bs.pre.forEach(r => simBBLRound(c, r, null)); news(c, `The Big Bash is under way: ${BBL_CLUBS[ladderSorted(c.bbl.ladder)[0].s].name} lead after ${bs.pre.length} rounds.`); }

    } else {

}

  c.wtcHistory.unshift({ cycle: c.wtc.cycle, text: `${champ} (${r.text})` });

function advanceWindow(c) {

  const slot = SHIELD_SLOTS[w.id];
  const away = windowSquads(c, w);
  if (slot && slot.during.length) slot.during.forEach(r => { if (r === 'final') simShieldFinal(c, away); else simShieldRound(c, r, away); });
  const os = ODC_SLOTS[w.id];
  if (os && c.odc) os.during.forEach(r => { if (r === 'final') simODCFinal(c, away); else simODCRound(c, r, away); });

  if (bs && c.bbl && bs.mid && !w.bblMid) { w.bblMid = true; bs.mid.forEach(r => simBBLRound(c, r, away)); }

  passWeeks(c, Math.max(2, (w.weeks || 8) - (f ? f.tests : 0) - wbN * 0.4 - (slot ? slot.pre.length + slot.during.length : 0) * 1.5));

  const next = c.windows[c.ptr];
  if (next && next.season !== w.season) seasonEnd(c, w.season);

  if (c.windows[c.ptr] && c.windows[c.ptr].season >= last) c.windows.push(...makeSeason(last + 1));

// ---------- Season end: ageing, decline, potential, retirements, regens, intake ----------
function declineStart(p) { if (p.role === 'WK') return 33; if (!p.bowl || p.role === 'BAT') return 34; return isPace(p.bowl.type) ? 32 : 35; }
function seasonEnd(c, y) {
  const report = { retired: [], improved: [], wonderkids: [] };
  NATIONS.forEach(code => c.players[code].forEach(p => {
    const o0 = overallRaw(p);
    // training growth: everyone young keeps developing, more if they barely played
    const gap = clamp((potential(p) - o0) / 6, 0, 1.5);
    const played = p.sp ? p.sp.n : 0;
    const train = ageRate(p.age) * gap * (played < 4 ? 2.4 : 1.0);
    if (train > 0) { addAttr(p, p.role === 'BOWL' ? 'bowl' : 'bat', train); if (p.role === 'AR') addAttr(p, 'bowl', train * 0.8); if (p.role === 'WK') addAttr(p, 'keep', train * 0.5); }
    // potential review for young players
    if (p.age <= 25 && p.sp) {
      const avg = p.sp.n ? p.sp.sum / p.sp.n : 0;
      if (p.sp.n >= 4 && avg > 0.5) p.potRaw = Math.min(97, potential(p) + (avg > 1 ? 2 : 1));
      else if (p.sp.n >= 4 && avg < -0.4) p.potRaw = Math.max(overall(p), potential(p) - 1);
      else if (p.sp.n === 0 && p.age >= 21 && Math.random() < 0.35) p.potRaw = Math.max(overall(p), potential(p) - 1);
    }
    p.age++;
    const st = declineStart(p);
    if (p.age > st) {
      const dec = 0.5 + 0.3 * (p.age - st);
      const down = (o, k, a) => { if (o && o[k] != null) o[k] = clamp(Math.round((o[k] - a) * 10) / 10, 1, 99); };
      ['tech', 'conc', 'off', 'on', 'vSpin'].forEach(k => down(p.bat, k, dec * rand(0.5, 1.1)));
      down(p.bat, 'vPace', dec * rand(0.9, 1.4));
      if (p.bowl) { down(p.bowl, 'skill', dec * rand(0.7, 1.2)); down(p.bowl, 'acc', dec * 0.4); down(p.bowl, 'stam', dec * (isPace(p.bowl.type) ? 1.6 : 0.6)); ['swing', 'seam', 'turn', 'flight'].forEach(k => down(p.bowl, k, dec * 0.5)); }
      down(p.bat, 'power', dec * rand(0.6, 1.2)); down(p.bat, 'finish', dec * rand(0.2, 0.6));
      if (p.bowl) { down(p.bowl, 'death', dec * 0.4); down(p.bowl, 'vars', dec * 0.15); }
      down(p, 'field', dec * 0.8); down(p, 'ground', dec);
      if (p.keep) p.keep = clamp(p.keep - dec * 0.6, 1, 99);
    }
    if (p.age >= 28) p.potRaw = Math.max(overall(p), Math.min(potential(p), overall(p) + Math.max(0, 31 - p.age)));
    p.peak = Math.max(p.peak || 0, overall(p));
    p.peakWB = Math.max(p.peakWB || 0, wbOverall(p, 'odi'), wbOverall(p, 't20'));
    p.hist = (p.hist || []).concat([{ y: y + 1, o: overall(p), p: potential(p) }]).slice(-12);
    const d = overallRaw(p) - o0;
    if (code === 'AUS' && d >= 3) report.improved.push([p.name, Math.round(d)]);
    p.sp = { n: 0, sum: 0 };
  }));
  // retirements and regens
  NATIONS.forEach(code => {
    const list = c.players[code];
    list.slice().forEach(p => {
      const o = overall(p);
      const base = p.age <= 31 ? 0 : [0.02, 0.04, 0.07, 0.11, 0.16, 0.24, 0.33, 0.45][Math.min(7, p.age - 32)] || 0.6;
      let pr = base * (o >= 85 ? 0.5 : o < 70 ? 1.5 : 1) + (p.age >= 41 ? 0.4 : 0);
      if (p.age >= 27 && o < 58 && potential(p) < 64) pr = 0.6;
      if (code === 'AUS' && (p.morale || 65) < 30 && p.age >= 31 && !(c.contracts || []).includes(p.name)) pr += 0.25;
      if (Math.random() < pr) {
        list.splice(list.indexOf(p), 1);
        p.retired = true;
        retireSnapshot(c, p);
        if (c.captain === p.name) { c.captain = null; news(c, `Your captain ${p.name} has retired. Name a new captain on the Board screen.`, 'bad'); }
        if (o >= 72 || (p.peak || 0) >= 80) report.retired.push(`${p.name} (${code}, ${p.age})`);
        if ((p.peak || 0) >= 72 || Math.random() < 0.5) {
          const r = makeRegen(c, code, p);
          list.push(r);
          if (potential(r) >= 87) report.wonderkids.push(`${r.name} (${code}${r.state ? ' ' + r.state : ''}, POT ${potential(r)}, regen of ${p.name})`);
        }

  });
  NATIONS.forEach(code => c.players[code].forEach(p => { p.morale = Math.round((p.morale != null ? p.morale : 65) * 0.7 + 65 * 0.3); if (p.lead == null) p.lead = defaultLead(p); }));
  c.contractRound = true;
  // youth intake
  STATE_CODES.forEach(s => { for (let i = 0; i < 2; i++) { const r = makeRegen(c, 'AUS', null, s); c.players.AUS.push(r); if (potential(r) >= 87) report.wonderkids.push(`${r.name} (AUS ${s}, POT ${potential(r)})`); } });
  NATIONS.filter(n => n !== 'AUS').forEach(code => { const k = c.players[code].length < 18 ? 2 : 1; for (let i = 0; i < k; i++) c.players[code].push(makeRegen(c, code, null)); });
  // trim lists
  STATE_CODES.forEach(s => {
    const sq = statePool(c, s);
    if (sq.length > 28) sq.sort((a, b) => (overall(a) + potential(a) * 0.5) - (overall(b) + potential(b) * 0.5)).slice(0, sq.length - 28).forEach(p => { c.players.AUS.splice(c.players.AUS.indexOf(p), 1); });
  });
  NATIONS.filter(n => n !== 'AUS').forEach(code => {
    const l = c.players[code];
    if (l.length > 24) l.sort((a, b) => (overall(b) + potential(b) * 0.4) - (overall(a) + potential(a) * 0.4)).length = 24;
  });
  // Shield history and new season
  if (c.shield) c.shieldHistory.unshift({ y, champ: c.shield.champ || shieldLadder(c)[0].s });
  c.shield = newShieldSeason(y + 1);
  pruneSave(c);
  if (c.odc) { c.odcHistory = c.odcHistory || []; c.odcHistory.unshift({ y, champ: c.odc.champ || ladderSorted(c.odc.ladder)[0].s }); c.odc = newODCSeason(y + 1); }
  if (c.bbl) { c.bblHistory = c.bblHistory || []; c.bblHistory.unshift({ y, champ: c.bbl.champ || ladderSorted(c.bbl.ladder)[0].s }); bump(c); newBBLSeason(c, y + 1); }
  bump(c);
  if (report.retired.length) news(c, `Retirements: ${report.retired.join(', ')}.`, 'big');
  if (report.wonderkids.length) news(c, `New talent: ${report.wonderkids.join(', ')}.`, 'good');
  report.improved.sort((a, b) => b[1] - a[1]);
  if (report.improved.length) news(c, `Most improved Australians this season: ${report.improved.slice(0, 6).map(([n, d]) => `${n} (+${d})`).join(', ')}.`, 'good');
  news(c, `Season ${seasonLabel(y + 1)} begins. Everyone is a year older. Contract renewals are due: review them on the Board screen.`, 'big');
  c.lastReport = report;
}

  }

  if (role === 'AR' && !bowl) bowl = pickW(['RFM', 'RM', 'OB', 'SLA'], [40, 15, 25, 20]);
  const start = clamp(48 + rint(0, 9) + (pot - 75) * 0.25, 44, 68);
  const batL = role === 'BOWL' ? rint(25, 45) : role === 'AR' ? start - 2 : role === 'WK' ? start - 1 : start;
  const bowlL = role === 'BOWL' ? start + 1 : start - 3;
  const x = { h: hand, st: state || (tmpl && tmpl.state) || null, keep: role === 'WK' ? start + 6 : 0 };
  const p = Q(name, age, role, batL, agg, tilt, bowl && (role === 'BOWL' || role === 'AR' || Math.random() < 0.3) ? `${bowl} ${role === 'BOWL' || role === 'AR' ? bowlL : rint(30, 45)}` : null, pot, x);

  ${seasons.map(y => `<div class="card" style="margin-bottom:12px"><h3>${CR.seasonLabel(y)}</h3>
    ${C.windows.filter(w => w.season === y).map(w => { const i = C.windows.indexOf(w), past = i < C.ptr, now = i === C.ptr, fx = CR.fixturesOf(w);
      const canAdd = !past && !w.wtc && !w.noTour && ['test', 'odi', 't20'].some(fm => !fx.some(f => fmtF(f) === fm));

      <div>${fx.length ? fx.map(f => { const locked = past || f.wc || f.fixed || f.final || f.status !== 'planned';
        return `<div class="calfx"><span><span class="fb f-${fmtF(f)}">${FN[fmtF(f)]}</span> ${esc(f.title || fixtureDesc(f))}<div class="mute sm">${fixtureDesc(f)} · ${f.wc ? 'hosts ' + w.event.host.map(tName).join(' and ') : f.venues.map(v => esc(VENUES[v].name.split(',')[0])).join(', ')}${f.status !== 'planned' ? ' · ' + seriesLine(f) : ''}</div></span>
          <span class="right">${locked ? '' : `<button class="sm" data-plan="${w.key}|${fmtF(f)}">Edit</button> <button class="sm" data-cancel="${w.key}|${fmtF(f)}">Cancel</button>`}</span></div>`; }).join('')
        : `<span class="mute">${w.past ? esc(w.past) : w.event ? `${esc(w.event.name)} in ${w.event.host.map(tName).join(' and ')}. Australia's squad is named when it arrives.` : w.wtc ? 'World Test Championship Final' : past ? 'No series' : 'Open'}</span>`}</div>

function planModal(key) {
  const [wk, fm0] = key.split('|');

  const free = ['test', 'odi', 't20'].filter(fm => !fx.some(f => fmtF(f) === fm));
  const editF = fm0 ? fx.find(f => fmtF(f) === fm0) : null;
  const st = ui.plan || (ui.plan = editF ? { fmt: fm0, opp: editF.opp, home: editF.home, tests: editF.tests, venues: editF.venues.slice(), title: editF.title, when: editF.when || 'post', edit: true }
    : { fmt: free[0] || 'test', opp: (fx[0] && fx[0].opp) || 'IND', home: fx[0] ? fx[0].home : w.type !== 'away', tests: free[0] === 'test' || !free[0] ? 3 : 3, venues: null, title: '', when: 'post' });
  if (w.type === 'home') st.home = true; if (w.type === 'away') st.home = false;
  const lo = st.fmt !== 'test';
  const host = st.home ? 'AUS' : st.opp, vlist = lo ? CR.venuesOfLO(host) : CR.venuesOf(host);
  if (!st.venues || st.venues.length !== st.tests || !st.venues.every(v => VENUES[v].home === host)) st.venues = lo ? CR.defaultVenuesLO(host, st.tests, st.fmt) : CR.defaultVenues(host, st.tests);
  const fmts = st.edit ? [st.fmt] : free;
  const hasTests = !!w.fixture && st.fmt !== 'test';
  return `<div class="modal-bg"><div class="modal wide"><h2>Plan ${lo ? 'series' : 'tour'} · ${esc(w.label)} ${CR.seasonLabel(w.season)}</h2>
    <div class="form">
      <label>Format<select id="pFmt" ${st.edit ? 'disabled' : ''}>${fmts.map(fm => `<option value="${fm}" ${fm === st.fmt ? 'selected' : ''}>${FNP[fm]}</option>`).join('')}</select></label>
      <label>Opponent<select id="pOpp">${CR.NATIONS.filter(n => n !== 'AUS').map(n => `<option value="${n}" ${n === st.opp ? 'selected' : ''}>${tName(n)} (${FN[st.fmt]} rank ${rankOf(n, st.fmt)})</option>`).join('')}</select></label>
      <label>Where<select id="pHome" ${w.type !== 'either' ? 'disabled' : ''}><option value="1" ${st.home ? 'selected' : ''}>Home (in Australia)</option><option value="0" ${!st.home ? 'selected' : ''}>Away (in ${tName(st.opp)})</option></select></label>
      <label>${FNP[st.fmt]}<select id="pTests">${[1, 2, 3, 4, 5].map(n => `<option ${n === st.tests ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      ${hasTests ? `<label>When<select id="pWhen"><option value="pre" ${st.when === 'pre' ? 'selected' : ''}>Before the Tests</option><option value="post" ${st.when !== 'pre' ? 'selected' : ''}>After the Tests</option></select></label>` : ''}
      <label>Series name<input id="pTitle" value="${esc(st.title)}" placeholder="Optional, e.g. The Ashes"></label></div>
    <p class="mute sm">${lo ? 'White-ball series move the ODI or T20I rankings and give your limited-overs players games. They count less with the board than Tests.' : (CR.WTC_TEAMS.includes(st.opp) ? 'Counts towards the World Test Championship.' : 'Not part of the World Test Championship.') + ' Away tours develop young players faster.'}</p>
    <h3 style="margin-top:8px">Venues</h3>
    ${st.venues.map((v, i) => `<div class="row"><span class="mute">${FN[st.fmt]} ${i + 1}</span><select data-pv="${i}">${vlist.map(k => `<option value="${k}" ${k === v ? 'selected' : ''}>${esc(VENUES[k].name)}</option>`).join('')}</select></div>`).join('')}
    <div class="btns"><button class="primary" id="pSave">Book ${lo ? 'series' : 'tour'}</button><button id="mClose">Cancel</button></div></div></div>`;
}
function rankOf(code, fmt) { const T = !fmt || fmt === 'test' ? C.trank : C.trankWB[fmt]; return Object.entries(T).sort((a, b) => b[1] - a[1]).findIndex(([t]) => t === code) + 1; }

const srS = s => s && s.balls ? (s.runs / s.balls * 100).toFixed(1) : '-';

function vPlayers() {

  const keyF = { ovr: p => E.fmtOVR(p, fm), pot: p => E.fmtPOT(p, fm), age: p => -p.age, form: p => p.form || 0, runs: p => (st_(p.name, comp) || {}).runs || 0, wk: p => (st_(p.name, comp) || {}).wk || 0,
    sruns: p => ((fm === 'test' ? C.shield : fm === 'odi' ? C.odc : C.bbl).stats[p.name] || {}).runs || 0, swk: p => ((fm === 'test' ? C.shield : fm === 'odi' ? C.odc : C.bbl).stats[p.name] || {}).wk || 0 }[sk] || (p => E.fmtOVR(p, fm));

function profileModal(name) {

    <div class="grid3c">

function lbLeaders(stats, lo, nameF) {

    <div class="mute sm" style="margin-top:8px">Most wickets</div>${wk.map(([n, s]) => `<div class="row sm"><span>${pl(n)} <span class="mute">${nameF(n)}</span></span><span class="mono">${s.wk} @ ${(s.bRuns / s.wk).toFixed(1)}${lo ? ` · econ ${ecS(s)}` : ''}</span></div>`).join('') || '<div class="mute">-</div>'}`;
}
function loLadder(L, nameF, top, extra) {

}
function resultsList(res, nameF) {

// ================= STATS =================
function vStats() {
  const comp = ui.comp || 'test', scope = ui.scope || 'ALL', cat = ui.cat || 'bat';
  const rows = [];
  const seasonSrc = { season: C.shield.stats, odcS: C.odc.stats, bblS: C.bbl.stats }[comp];
  const src = seasonSrc ? Object.entries(seasonSrc) : Object.entries(C.stats).map(([n, o]) => [n, o[comp]]).filter(x => x[1]);
  const lo = ['odi', 't20i', 'odc', 'bbl', 'odcS', 'bblS'].includes(comp), intl = ['test', 'odi', 't20i'].includes(comp);
  src.forEach(([n, s]) => {
    const p = CR.P_(C, n); const nat = p ? p.nat : '?';
    if (scope !== 'ALL' && nat !== scope && !(scope === 'AUS' && p && p.state)) return;
    rows.push({ n, s, nat, st: p ? p.state : '', retired: !p });
  });
  const minI = +(ui.min || (comp === 'test' ? 3 : 3));
  const cols = {
    bat: [['Player', r => `${pl(r.n)} <span class="mute sm">${intl ? r.nat : r.st || r.nat}</span>`], ['M', r => r.s.m, 'm'], ['Inn', r => r.s.inn, 'inn'], ['NO', r => r.s.no, 'no'], ['Runs', r => r.s.runs, 'runs'], ['HS', r => r.s.hs + (r.s.hsNo ? '*' : ''), 'hs'],
      ['Avg', r => avgS(r.s), 'avg'], ['Balls', r => r.s.balls, 'balls'], ['SR', r => r.s.balls ? (r.s.runs / r.s.balls * 100).toFixed(1) : '-', 'sr'], ['100', r => r.s.h100, 'h100'], ['50', r => r.s.h50, 'h50'], ['0', r => r.s.ducks, 'ducks'], ['4s', r => r.s.fours, 'fours'], ['6s', r => r.s.sixes, 'sixes']],
    bowl: [['Player', r => `${pl(r.n)} <span class="mute sm">${intl ? r.nat : r.st || r.nat}</span>`], ['M', r => r.s.m, 'm'], ['Overs', r => E.oversStr(r.s.bBalls), 'bBalls'], ['Mdns', r => r.s.mdn, 'mdn'], ['Runs', r => r.s.bRuns, 'bRuns'], ['Wkts', r => r.s.wk, 'wk'],
      ['Avg', r => r.s.wk ? (r.s.bRuns / r.s.wk).toFixed(2) : '-', 'bavg'], ['Econ', r => r.s.bBalls ? (r.s.bRuns / r.s.bBalls * 6).toFixed(2) : '-', 'econ'], ['SR', r => r.s.wk ? (r.s.bBalls / r.s.wk).toFixed(1) : '-', 'bsr'], ['Best', r => r.s.bw ? `${r.s.bw}/${r.s.br}` : '-', 'bw'], ...(lo ? [['4w', r => r.s.fourW || 0, 'fourW'], ['5w', r => r.s.fiveW, 'fiveW']] : [['5w', r => r.s.fiveW, 'fiveW'], ['10w', r => r.s.tenW, 'tenW']])],
    field: [['Player', r => `${pl(r.n)} <span class="mute sm">${intl ? r.nat : r.st || r.nat}</span>`], ['M', r => r.s.m, 'm'], ['Catches', r => r.s.ct, 'ct'], ['Stumpings', r => r.s.st, 'st'], ['Run outs', r => r.s.ro, 'ro'], ['Dismissals', r => r.s.ct + r.s.st + r.s.ro, 'dis'], ['Per match', r => r.s.m ? ((r.s.ct + r.s.st + r.s.ro) / r.s.m).toFixed(2) : '-', 'pm']],
  }[cat];
  const num = { avg: s => s.inn - s.no > 0 ? s.runs / (s.inn - s.no) : 0, sr: s => s.balls ? s.runs / s.balls : 0, bavg: s => s.wk ? -s.bRuns / s.wk : -999, econ: s => s.bBalls ? -s.bRuns / s.bBalls : -99, bsr: s => s.wk ? -s.bBalls / s.wk : -999, bw: s => s.bw * 1000 - s.br, dis: s => s.ct + s.st + s.ro, pm: s => s.m ? (s.ct + s.st + s.ro) / s.m : 0 };
  const sk = ui.sk || (cat === 'bat' ? 'runs' : cat === 'bowl' ? 'wk' : 'dis');
  const qual = cat === 'bat' ? (r => ['avg', 'sr'].includes(sk) ? r.s.inn >= minI : r.s.inn > 0) : cat === 'bowl' ? (r => ['bavg', 'econ', 'bsr'].includes(sk) ? r.s.wk >= minI * 3 : r.s.bBalls > 0) : (r => r.s.m > 0);
  const list = rows.filter(qual).sort((a, b) => (num[sk] ? num[sk](b.s) - num[sk](a.s) : (b.s[sk] || 0) - (a.s[sk] || 0))).slice(0, 60);
  const opt = (id, cur, items) => `<select id="${id}">${items.map(([v, l]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  return `<div class="wrap"><div class="top"><h2>Stats</h2><div class="filters">
    ${opt('sComp', comp, [['test', 'Test career'], ['odi', 'ODI career'], ['t20i', 'T20I career'], ['shield', 'Shield career'], ['season', `Shield ${CR.seasonLabel(C.shield.y)}`], ['odc', 'One-Day Cup career'], ['odcS', `One-Day Cup ${CR.seasonLabel(C.odc.y)}`], ['bbl', 'BBL career'], ['bblS', `BBL|${C.bbl.y - 2010}`]])}
    ${opt('sScope', scope, [['ALL', 'All players'], ...CR.NATIONS.map(n => [n, tName(n)])])}
    ${opt('sCat', cat, [['bat', 'Batting'], ['bowl', 'Bowling'], ['field', 'Fielding']])}
    ${opt('sMin', String(minI), [['1', 'Min 1'], ['3', 'Min 3'], ['5', 'Min 5'], ['10', 'Min 10']])}</div></div>
  <p class="mute sm">Click a column to sort. Averages and strike rates need the minimum innings (or three times that many wickets for bowlers). Stats count from the start of this career.</p>
  <div class="card scroll">${list.length ? `<table><tr><th>#</th>${cols.map(c => `<th class="${c[2] ? 'n sortable' : ''} ${c[2] === sk ? 'on' : ''}" ${c[2] ? `data-ssort="${c[2]}"` : ''}>${c[0]}</th>`).join('')}</tr>
    ${list.map((r, i) => `<tr><td class="mute">${i + 1}</td>${cols.map(c => `<td class="${c[2] ? 'n' : ''}">${c[1](r)}</td>`).join('')}</tr>`).join('')}</table>` : '<div class="mute">No stats yet for this view.</div>'}</div></div>`;
}

// ================= RANKINGS =================
function vRankings() {
  const t = ui.rt || 'bat', fm = ui.rf || 'test';
  const tabsF = `<div class="tabs" style="margin:0 0 12px">${['test', 'odi', 't20'].map(f => `<button data-rf="${f}" class="${fm === f ? 'on' : ''}">${FN[f]}</button>`).join('')}</div>`;
  const P = fm === 'test' ? C.prank : C.prankWB[fm], T = fm === 'test' ? C.trank : C.trankWB[fm];
  const active = Object.entries(P).filter(([n, r]) => C.ptr - r.last <= (fm === 'test' ? 5 : 6) && CR.P_(C, n));
  const list = t === 'bat' ? active.sort((a, b) => b[1].bat - a[1].bat).map(([n, r]) => [n, r.bat])
    : t === 'bowl' ? active.filter(([n, r]) => r.bowl).sort((a, b) => b[1].bowl - a[1].bowl).map(([n, r]) => [n, r.bowl])
    : active.filter(([n, r]) => r.bat > 200 && r.bowl > 200).map(([n, r]) => [n, Math.round(r.bat * r.bowl / 1000)]).sort((a, b) => b[1] - a[1]);
  const tr = Object.entries(T).sort((a, b) => b[1] - a[1]);
  const wt = CR.wtcSorted(C);
  const left = fm === 'test' ? `<div class="card"><h3>World Test Championship ${C.wtc.cycle}</h3><table><tr><th>#</th><th>Team</th><th class="n">P</th><th class="n">W</th><th class="n">L</th><th class="n">D</th><th class="n">Pts</th><th class="n">PCT</th></tr>
      ${wt.map((r, i) => `<tr class="${i < 2 ? 'top2' : ''} ${r.t === 'AUS' ? 'us' : ''}"><td>${i + 1}</td><td>${tName(r.t)}</td><td class="n">${r.p}</td><td class="n">${r.w}</td><td class="n">${r.l}</td><td class="n">${r.d}</td><td class="n">${r.pts}</td><td class="n"><b>${r.pct.toFixed(2)}</b></td></tr>`).join('')}</table>
      <div class="mute sm" style="margin-top:6px">Win 12, draw 4, tie 6. Ranked by percentage of points. Top two meet in the final at Lord's.</div>

    <p>${esc(m.venue.name)}: ${esc(m.venue.desc)}</p><p>Weather: ${E.WX_ICON[m.wx[0]]} ${m.wx[0]}.${m.reduced ? ` Rain has cut the match to ${m.maxOvers} overs a side.` : ''} ${m.dn ? 'Under lights, the dew can make the ball skid on and spin harder to grip for the side bowling second.' : ''} ${m.venue.pace >= 3 || m.wx[0] === 'Overcast' ? 'The new ball should do a bit early.' : ''}</p>
    <div class="btns"><button class="primary" data-toss="bat">Bat first</button><button data-toss="bowl">Bowl first</button></div></div></div>`;
  if (m.pending.kind === 'toss') return `<div class="modal-bg locked"><div class="modal"><h2>You've won the toss</h2>
    <p>${esc(m.venue.name)}: ${esc(m.venue.desc)}</p><p>Weather this morning: ${E.WX_ICON[m.wx[0]]} ${m.wx[0]}. ${m.wx[0] === 'Overcast' || m.wx[0] === 'Humid' ? 'Good conditions for swing.' : m.wx[0] === 'Sunny' ? 'A good day to bat.' : ''} The pitch wears as the match goes on.</p>
    ${forecastStrip(m.wx, m.days, 0)}
    <div class="btns"><button class="primary" data-toss="bat">Bat first</button><button data-toss="bowl">Bowl first</button></div></div></div>`;
  if (m.pending.kind === 'followon') return `<div class="modal-bg locked"><div class="modal"><h2>Enforce the follow-on?</h2>
    <p>You lead by ${m.pending.lead}. Enforcing sends ${esc(m.teams[1 - m.user].name)} straight back in, but your bowlers get no rest. ${Math.round(E.oversLeft(m))} overs remain.</p>
    <div class="btns"><button class="primary" data-fo="1">Enforce</button><button data-fo="0">Bat again</button></div></div></div>`;
  return '';
}

function afterMatch() {
  const m = C.match, f = curFixture(), fm = fmtF(f), lo = !!m.lo, w = CR.curWindow(C);
  const usIdx = m.user;
  if (lo) CR.recordMatch(C, m, CR.FMT_COMP[fm], { awayTeam: f.home || (f.wc && m.teams[0].code === 'AUS') ? 1 : 0, wc: !!f.wc });
  else {
    CR.recordMatch(C, m, 'test', { awayTeam: f.home || f.neutral ? 1 : 0, final: !!f.final });
    if (!f.home && !f.neutral) f.squad.filter(n => !m.teams[m.user].players.some(p => p.name === n)).forEach(n => { const p = CR.P_(C, n); if (p) CR.touringGrowth(C, p); });
  }
  CR.passWeeks(C, lo ? 0.4 : 1);
  const potm = CR.playerOfMatch(m);
  const line = i => lo ? `${i.runs}/${i.wkts}${i.legal < i.maxBalls && i.wkts < 10 ? ` (${E.oversStr(i.legal)})` : ''}` : E.scoreLine(i);
  const scores = m.teams.map((t, ti) => `${t.short} ${m.innings.filter(i => i.bat === ti && !i.so).map(line).join(' & ') || '-'}`).join(', ');
  f.results.push({ venue: m.venueKey, text: m.result.text, winner: m.result.winner === -1 ? null : m.teams[m.result.winner].code, scores, potm: potm ? potm.name : '', opp: m.teams[1 - usIdx].code });
  f.testIdx++;
  C.match = null;
  const label = f.wc ? `${f.title}, ${f.matches[f.testIdx - 1].stage.toLowerCase()} v ${tName(f.matches[f.testIdx - 1].opp)}` : `${matchWord(f)} ${f.testIdx}${f.title ? ' (' + f.title + ')' : ''}`;
  CR.news(C, `${label}: ${m.result.text}.`, m.result.winner === usIdx ? 'good' : m.result.winner === -1 ? '' : 'bad');
  if (f.wc) CR.wcAfterMatch(C, f, m);
  CR.windowProgress(C, w);
  if (f.testIdx >= f.tests || f.status === 'done') {
    f.status = 'done';
    C.history.push({ season: CR.seasonLabel(w.season), title: f.title || fixtureDesc(f), result: seriesLine(f), tests: f.results.map(r => r.winner), fmt: fm });
    CR.news(C, `${f.title || fixtureDesc(f)}: ${seriesLine(f)}.`, 'big');
    if (fm === 'test') CR.seriesFinished(C, f); else CR.seriesFinishedWB(C, f);
  }
  C.date = CR.isoD(CR.addDays(CR.matchDate(w, f, f.testIdx - 1), lo ? 1 : 5));
  CR.goatCheck(C);
  save(); go('series', { fx: f.status === 'done' ? f : null });
}
function advance() {
  const y0 = CR.curWindow(C).season;
  $('#app').insertAdjacentHTML('beforeend', '<div class="modal-bg"><div class="modal"><h2>Simulating…</h2><p class="mute">Shield rounds and Tests around the world are being played.</p></div></div>');
  setTimeout(() => {
    CR.advanceWindow(C); save();
    const y1 = CR.curWindow(C).season;
    go('hub');
    if (y1 !== y0 && C.lastReport) openModal(() => seasonModal(C.lastReport, y1));
  }, 30);
}

function confBar(v) { const cls = v >= 60 ? 'g' : v >= 35 ? 's' : 'b'; return `<div class="conf"><span class="abar big"><i class="${cls}" style="width:${v}%"></i></span><b>${Math.round(v)}%</b></div><div class="mute sm">${v >= 75 ? 'The board is delighted with you.' : v >= 55 ? 'The board is happy with your work.' : v >= 35 ? 'The board expects improvement.' : v >= 15 ? 'Your job is under pressure.' : 'Your job is on the line.'}</div>`; }

function vBoard() {
  const aus = C.players.AUS.slice().sort((a, b) => E.overall(b) - E.overall(a));
  const sel = ui.cset || (ui.cset = new Set(C.contracts));
  const editable = C.contractRound;
  const leaders = aus.filter(p => E.overall(p) >= 70).sort((a, b) => b.lead - a.lead);
  const capOpts = cur => leaders.map(p => `<option value="${esc(p.name)}" ${p.name === cur ? 'selected' : ''}>${esc(p.name)} (leadership ${Math.round(p.lead)}, OVR ${E.overall(p)})</option>`).join('');
  const best = p => Math.max(E.overall(p), E.wbOverall(p, 'odi'), E.wbOverall(p, 't20'));
  const list = aus.filter(p => sel.has(p.name) || best(p) >= (ui.cmin || 72)).sort((a, b) => best(b) - best(a));
  return `<div class="wrap"><h2 style="margin-bottom:10px">Board room</h2><div class="grid2">
    <div class="card"><h3>Board confidence</h3>${confBar(C.board.conf)}
      ${C.board.exp ? `<div class="sm" style="margin-top:8px">Current target: <b>${esc(C.board.exp)}</b></div>` : ''}
      <div class="mute sm" style="margin-top:8px">The board judges you on results against expectations, the WTC, giving young players a chance, and whether you pick in-form players. Ignoring big Shield performers or backing out-of-form players draws media criticism.</div>
      <h3 style="margin-top:12px">Recent verdicts</h3>${C.board.log.slice(0, 10).map(l => `<div class="row sm"><span>${esc(l.why)}</span><span class="${l.v >= 0 ? 'win' : 'loss'}">${l.v >= 0 ? '+' : ''}${Math.round(l.v * 10) / 10}</span></div>`).join('') || '<div class="mute sm">Nothing yet.</div>'}</div>
    <div class="card"><h3>Captaincy</h3>
      <div class="form"><label>Captain<select id="capSel"><option value="">None</option>${capOpts(C.captain)}</select></label><label>Vice-captain<select id="viceSel"><option value="">None</option>${capOpts(C.vice)}</select></label></div>
      <p class="mute sm">A strong leader lifts the whole side a little and makes sharper bowling changes. Weak leaders can let the job weigh on their own batting. Changing captain upsets the old one, and doing it mid-series worries the board.</p>
      <button class="primary" id="capSave">Confirm Test leadership</button>
      <h3 style="margin-top:14px">White-ball captains</h3>
      ${['odi', 't20'].map(f => { const cc = C.captains[f] || []; const opts = cur => aus.filter(p => E.wbOverall(p, f) >= 72 && CR.intlOK(p, f)).sort((a, b) => b.lead - a.lead).map(p => `<option value="${esc(p.name)}" ${p.name === cur ? 'selected' : ''}>${esc(p.name)} (leadership ${Math.round(p.lead)}, ${FN[f]} ${E.wbOverall(p, f)})</option>`).join('');
        return `<div class="form"><label>${FN[f]} captain<select id="wcap_${f}"><option value="">None</option>${opts(cc[0])}</select></label><label>Vice<select id="wvice_${f}"><option value="">None</option>${opts(cc[1])}</select></label></div>`; }).join('')}
      <button id="wcapSave">Confirm white-ball leadership</button></div></div>
  <div class="card" style="margin-top:14px"><div class="top"><h3 style="margin:0">National contracts ${CR.seasonLabel(CR.curWindow(C).season)} · ${sel.size} players</h3>
    <div class="filters"><select id="cMin">${[60, 68, 72, 76].map(n => `<option value="${n}" ${n === (ui.cmin || 72) ? 'selected' : ''}>OVR ${n}+</option>`).join('')}</select>
    ${editable ? `<button class="primary" id="cConfirm" ${sel.size >= 20 && sel.size <= 24 ? '' : 'disabled'}>Confirm contracts</button>` : ''}</div></div>
    <p class="mute sm">${editable ? 'Renewals are open. Offer 20 to 24 contracts. New contracts lift morale; losing one hurts, and unhappy veterans may walk away from Test cricket.' : 'Contracts renew once a season, at the start of the winter. Anyone who plays a Test without one gets an automatic upgrade.'}</p>
    <div class="scroll"><table><tr><th></th><th>Player</th><th class="n">Age</th><th>State</th><th>Role</th><th>Test</th><th>ODI</th><th>T20</th><th>POT</th><th>Form</th><th>Morale</th><th class="n">Leadership</th></tr>
    ${list.map(p => `<tr class="${editable ? 'pick' : ''} ${sel.has(p.name) ? 'sel' : ''}" ${editable ? `data-ctog="${esc(p.name)}"` : ''}><td><input type="checkbox" ${sel.has(p.name) ? 'checked' : ''} ${editable ? '' : 'disabled'}></td><td>${pl(p.name)}${capTag(p.name)} ${injTag(p)}</td><td class="n">${p.age}</td><td>${p.state || ''}</td><td>${p.role}</td><td>${badge(E.overall(p))}</td><td>${badge(E.wbOverall(p, 'odi'))}</td><td>${badge(E.wbOverall(p, 't20'))}</td><td>${badge(Math.max(E.potential(p), E.wbPotential(p, 'odi'), E.wbPotential(p, 't20')), 'pot')}</td><td>${formTag(p)}</td><td>${morTag(p)}</td><td class="n">${Math.round(p.lead)}</td></tr>`).join('')}</table></div></div></div>`;
}

function vGoat() {
  const k = ui.gk || 'all', L = CR.goatLists(C), list = L[k].slice(0, 50);
  const tabs = [['all', 'Overall'], ['bat', 'Batting'], ['bowl', 'Bowling'], ['ar', 'All-rounders'], ['runs', 'Most runs'], ['wk', 'Most wickets']];

  return `<div class="wrap"><div class="top"><div><h2>Greatest of all time</h2><p class="mute sm" style="margin:4px 0 0">Real Test careers up to November 2026, plus everything in this save. Legends are fixed; active players climb as they score runs and take wickets.</p></div>
    <div class="tabs" style="margin:0">${tabs.map(([v, l]) => `<button data-gk="${v}" class="${k === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>
  <div class="card scroll"><table><tr><th>#</th><th>Player</th><th>Team</th><th class="n">Tests</th><th class="n">Runs</th><th class="n">Avg</th><th class="n">100s</th><th class="n">Wkts</th><th class="n">Bowl avg</th><th class="n">${k === 'runs' ? 'Runs' : k === 'wk' ? 'Wkts' : 'GOAT score'}</th></tr>
  ${list.map((r, i) => `<tr class="${r.active && r.nat === 'AUS' ? 'us' : ''}"><td>${i + 1}</td><td>${r.active ? pl(r.name) : esc(r.name)} ${r.active ? '<span class="tag on">Active</span>' : r.retired ? '<span class="tag">Retired in this save</span>' : ''}</td><td>${tName(r.nat)}</td>

  on('#editSquad', 'onclick', () => go('squad', { sel: new Set(curFixture().squad) }));
  on('#toPre', 'onclick', () => { const f = curFixture(), fm = fmtF(f);
    if (!f.wc) { f.oppSquad = f.oppSquad.filter(n => CR.P_(C, n)); const opp = f.oppSquad.map(n => CR.P_(C, n)).filter(p => CR.available(p)); if (opp.length < 13) { (fm === 'test' ? CR.autoSquad(C.players[f.opp], 15) : CR.autoSquadLO(C.players[f.opp], fm, 15)).forEach(p => { if (!f.oppSquad.includes(p.name)) f.oppSquad.push(p.name); }); } }
    go('prematch'); });
  on('#finishSeries', 'onclick', () => { if (curFixture()) go('hub'); else advance(); });
  on('[data-slot]', 'onchange', e => { const i = +e.target.dataset.slot, n = e.target.value.replace(' (injured)', ''), j = ui.xi.indexOf(n); if (j >= 0) ui.xi[j] = ui.xi[i]; ui.xi[i] = n; render(); });
  on('#autoXI', 'onclick', () => { const f = curFixture(), fm = fmtF(f), sq = f.squad.map(n => CR.P_(C, n)).filter(Boolean), v = VENUES[f.venues[f.testIdx]]; ui.xi = fm === 'test' ? CR.autoXI(sq, v, restedEnergy()) : CR.autoXILO(sq, fm, v); ui.selSlot = null; render(); });
  on('#startTest', 'onclick', startTest);
  const m = C && C.match;
  if (m && screen === 'match') {
    const step = () => { save(); render(); };
    on('[data-sim]', 'onclick', e => { const b = e.currentTarget; E.simUntil(m, b.dataset.sim, +b.dataset.n || 0); step(); });
    on('[data-tab]', 'onclick', e => { tab = e.currentTarget.dataset.tab; render(); });
    on('[data-toss]', 'onclick', e => { E.tossDecision(m, e.currentTarget.dataset.toss); step(); });
    on('[data-fo]', 'onclick', e => { E.followOnDecision(m, e.currentTarget.dataset.fo === '1'); step(); });
    on('#pw', 'onchange', e => { m.stopOnWicket = e.target.checked; save(); });
    on('#peo', 'onchange', e => { m.pauseEachOver = e.target.checked; save(); });
    on('#ad', 'onchange', e => { m.autoDeclare = e.target.checked; save(); });
    on('#nw', 'onchange', e => { m.teams[m.user].nightwatch = e.target.value; save(); });
    on('#appr', 'onchange', e => { m.teams[m.user].approach = e.target.value; step(); });
    on('#fld', 'onchange', e => { m.teams[m.user].field = e.target.value; step(); });
    on('#bmode', 'onchange', e => { const t = m.teams[m.user]; t.bowlMode = e.target.value; if (t.bowlMode === 'manual') t.plan = m.lo ? [null, null] : m.endBowler.slice(); step(); });
    on('[data-end]', 'onchange', e => { if (e.target.value === '') return; E.setPlan(m, +e.target.dataset.end, +e.target.value); step(); });
    on('#nextBowler', 'onchange', e => { if (e.target.value === '') return; E.setPlan(m, 0, +e.target.value); step(); });
    on('#decl', 'onclick', () => { m.declareRequested = true; E.simUntil(m, 'ball'); step(); });
    on('#sb', 'onchange', e => { showBoundaries = e.target.checked; render(); });
    on('#afterMatch', 'onclick', afterMatch);
  }
}

C = load();
render();

// ================= UPDATES (website / installed app only) =================
// When a new version is published, the browser downloads it in the background and we offer a one-click update.
// Inside the claude.ai artifact or a local file this does nothing.
function showUpdateBar(worker) {
  if (document.querySelector('.updbar')) return;
  const bar = document.createElement('div'); bar.className = 'updbar';
  bar.innerHTML = '<span>A new version of Cricket Manager is ready.</span><button>Update</button>';
  bar.querySelector('button').onclick = () => { if (C) save(); worker.postMessage('update'); };
  document.body.appendChild(bar);
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/claude|anthropic/.test(location.hostname)) {
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar(w); });
    });
    setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
  }).catch(() => {});
}
</script>
